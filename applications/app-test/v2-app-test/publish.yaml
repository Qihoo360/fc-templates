Edition: 3.0.0
Type: Project
Effective: Public
Name: fc-zyun-app
Provider:
  - fc
Version: 0.0.3
Description: 快速部署一个 Golang 的 Hello World 函数到函数计算（FC）。
HomePage: https://github.com/Qihoo360/fc-templates/examples/custom-runtime/http-function
Organization: 函数计算（FC）
Tags:
  - 函数计算
  - 新手入门
Category: 新手入门
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - afunctionName
    - afunctionPolefsVolumn
    - afunctionMountDir
    - afunctionPolefsVolumnCreateUser
    - bfunctionName
    - bfunctionPolefsVolumn
    - bfunctionMountDir
    - bfunctionPolefsVolumnCreateUser
    - mysqlHost
    - mysqlDatabaseName
    - mysqlDatabasePort
    - mysqlAccountName
    - mysqlPassword
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-reaction-properties:
        - afunctionPolefsVolumn
        - bfunctionPolefsVolumn
      x-formitem:
        type: select
    afunctionName:
      title: A函数名
      type: string
      default: fc-zyun-golang-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    afunctionDescription:
      title: A函数描述
      type: string
      default: "Serverless fc-zyun-golang"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    afunctionPolefsVolumn:
      title: A函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: PoleFS 卷名称
      x-cate: applicationCate
      x-label: nasLabel
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: afunctionPolefsVolumnCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    afunctionMountDir:
      title: A函数挂载路径
      type: string
      description: 函数挂载路径
      default: "/mnt/data/x"
      x-cate: applicationCate
      x-label: nasLabel
      x-formitem:
        type: input
    afunctionPolefsVolumnCreateUser:
      title: A函数挂载的创建用户
      type: string
      default: ""
      description: 卷的创建用户
      x-cate: applicationCate
      x-label: nasLabel
      x-hidden: true
    bfunctionName:
      title: B函数名
      type: string
      default: fc-zyun-golang-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    bfunctionDescription:
      title: B函数描述
      type: string
      default: "Serverless fc-zyun-golang"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    bfunctionPolefsVolumn:
      title: B函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: PoleFS 卷名称
      x-cate: applicationCate
      x-label: nasLabel
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: bfunctionPolefsVolumnCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    bfunctionMountDir:
      title: B函数挂载路径
      type: string
      description: 函数挂载路径
      default: "/mnt/data/b"
      x-cate: applicationCate
      x-label: nasLabel
      x-formitem:
        type: input
    bfunctionPolefsVolumnCreateUser:
      title: B函数挂载卷的创建用户
      type: string
      default: ""
      description: 卷的创建用户
      x-cate: applicationCate
      x-label: nasLabel
      x-hidden: true
    mysqlHost:
      title: 数据库名 Host
      type: string
      default: 127.0.0.1
      description: 数据库地址
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlDatabaseName:
      title: 数据库名
      type: string
      default: db-test
      description: 数据库名
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlDatabasePort:
      title: 数据库端口
      type: integer
      default: 3306
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: 数据库端口
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlAccountName:
      title: 数据库用户名
      type: string
      default: root
      description: 数据库用户名
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlPassword:
      title: 数据库密码
      type: secret
      description: 数据库密码
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  mysqlLabel:
    title: "MySQL 配置"
    description: "部署应用前，请添加数据库授权，具体步骤可咨询管理人员。"
  nasLabel:
    title: "NAS 存储"
    description: ""

