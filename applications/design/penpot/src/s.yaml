edition: 3.0.0
name: penpot-app
access: default
vars:
  region: '{{region}}'
  PenpotFunctionName: '{{PenpotFunctionName}}'
  Description: '{{Description}}'
  PENPOT_SECRET_KEY: '{{PENPOT_SECRET_KEY}}'
  APPMKT_ALLOW_REGISTRATION: '{{APPMKT_ALLOW_REGISTRATION}}'
  Database: '{{Database}}'
  POSTGRES_HOST: '{{POSTGRES_HOST}}'
  POSTGRES_PORT: '{{POSTGRES_PORT}}'
  POSTGRES_DATABASE: '{{POSTGRES_DATABASE}}'
  POSTGRES_USERNAME: '{{POSTGRES_USERNAME}}'
  POSTGRES_PASSWORD: '{{POSTGRES_PASSWORD}}'
  POSTGRES_SSL_MODE: '{{POSTGRES_SSL_MODE}}'
  Cache: '{{Cache}}'
  REDIS_HOST: '{{REDIS_HOST}}'
  REDIS_PORT: '{{REDIS_PORT}}'
  REDIS_USERNAME: '{{REDIS_USERNAME}}'
  REDIS_PASSWORD: '{{REDIS_PASSWORD}}'
  REDIS_DATABASE: '{{REDIS_DATABASE}}'
  FileStorage: '{{FileStorage}}'
  PersistentStorage: '{{PersistentStorage}}'
  POLEFS_VOLUME: '{{POLEFS_VOLUME}}'
  POLEFS_VOLUME_CREATE_USER: '{{POLEFS_VOLUME_CREATE_USER}}'
  S3_HOST: '{{S3_HOST}}'
  S3_PORT: '{{S3_PORT}}'
  S3_BUCKET: '{{S3_BUCKET}}'
  S3_REGION: '{{S3_REGION}}'
  S3_AK: '{{S3_AK}}'
  S3_SK: '{{S3_SK}}'
  S3_ENDPOINT: '{{S3_ENDPOINT}}'
resources:
  penpot:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName: ${vars.PenpotFunctionName}
      description: ${vars.Description}
      runtime: custom
      runtimeType: customize
      requestType: http
      cloudBuildType: Dockerfile
      sourceSubDir: combined
      port: 8080
      cpu: 6
      memorySize: 10240
      requestCpu: 1
      requestMemory: 1024
      diskSize: 2048
      timeout: 300
      instanceConcurrency: 50
      networkType: vpc
      environmentVariables:
        PENPOT_DATABASE_URI: 'postgresql://${vars.POSTGRES_HOST}:${vars.POSTGRES_PORT}/${vars.POSTGRES_DATABASE}?sslmode=${vars.POSTGRES_SSL_MODE}'
        PENPOT_DATABASE_USERNAME: '${vars.POSTGRES_USERNAME}'
        PENPOT_DATABASE_PASSWORD: '${vars.POSTGRES_PASSWORD}'
        PENPOT_INTERNAL_URI: 'http://127.0.0.1:8080'
        PENPOT_BACKEND_URI: 'http://127.0.0.1:6060'
        PENPOT_ADMIN_CONSOLE_URI: 'http://127.0.0.1:3000'
        POSTGRES_HOST: '${vars.POSTGRES_HOST}'
        POSTGRES_PORT: '${vars.POSTGRES_PORT}'
        POSTGRES_DATABASE: '${vars.POSTGRES_DATABASE}'
        POSTGRES_USERNAME: '${vars.POSTGRES_USERNAME}'
        POSTGRES_PASSWORD: '${vars.POSTGRES_PASSWORD}'
        POSTGRES_SSL_MODE: '${vars.POSTGRES_SSL_MODE}'
        REDIS_HOST: '${vars.REDIS_HOST}'
        REDIS_PORT: '${vars.REDIS_PORT}'
        REDIS_USERNAME: '${vars.REDIS_USERNAME}'
        REDIS_PASSWORD: '${vars.REDIS_PASSWORD}'
        REDIS_DATABASE: '${vars.REDIS_DATABASE}'
        S3_HOST: '${vars.S3_HOST}'
        S3_PORT: '${vars.S3_PORT}'
        S3_BUCKET: '${vars.S3_BUCKET}'
        S3_REGION: '${vars.S3_REGION}'
        S3_AK: '${vars.S3_AK}'
        S3_SK: '${vars.S3_SK}'
        S3_ENDPOINT: '${vars.S3_ENDPOINT}'
        PENPOT_SECRET_KEY: '${vars.PENPOT_SECRET_KEY}'
        APPMKT_ALLOW_REGISTRATION: '${vars.APPMKT_ALLOW_REGISTRATION}'
        PENPOT_FILE_DATA_BACKEND: 'db'
        PENPOT_TELEMETRY_ENABLED: 'false'
        PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '33554432'
        JVM_OPTS: -Xms256m -Xmx4096m
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ''
      requestEntry: ''
      startCmd: ''
      requestEntryDescribe: ''
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: /data
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: false
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: false
          auth_config: ''
