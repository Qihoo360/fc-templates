edition: 3.0.0
name: penpot-app
access: default
vars:
  region: '{{region}}'
  FrontendFunctionName: '{{FrontendFunctionName}}'
  BackendFunctionName: '{{BackendFunctionName}}'
  AdminFunctionName: '{{AdminFunctionName}}'
  Description: '{{Description}}'
  PENPOT_PUBLIC_URI: '{{PENPOT_PUBLIC_URI}}'
  PENPOT_SECRET_KEY: '{{PENPOT_SECRET_KEY}}'
  APPMKT_ALLOW_REGISTRATION: '{{APPMKT_ALLOW_REGISTRATION}}'
  Database: '{{Database}}'
  POSTGRES_HOST: '{{POSTGRES_HOST}}'
  POSTGRES_PORT: '{{POSTGRES_PORT}}'
  POSTGRES_DATABASE: '{{POSTGRES_DATABASE}}'
  POSTGRES_USERNAME: '{{POSTGRES_USERNAME}}'
  POSTGRES_PASSWORD: '{{POSTGRES_PASSWORD}}'
  POSTGRES_SSL_MODE: '{{POSTGRES_SSL_MODE}}'
  Cache: '{{Cache}}'
  REDIS_HOST: '{{REDIS_HOST}}'
  REDIS_PORT: '{{REDIS_PORT}}'
  REDIS_USERNAME: '{{REDIS_USERNAME}}'
  REDIS_PASSWORD: '{{REDIS_PASSWORD}}'
  REDIS_DATABASE: '{{REDIS_DATABASE}}'
  FileStorage: '{{FileStorage}}'
  S3_HOST: '{{S3_HOST}}'
  S3_PORT: '{{S3_PORT}}'
  S3_BUCKET: '{{S3_BUCKET}}'
  S3_REGION: '{{S3_REGION}}'
  S3_AK: '{{S3_AK}}'
  S3_SK: '{{S3_SK}}'
  S3_ENDPOINT: '{{S3_ENDPOINT}}'
resources:
  penpotAdminConsole:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName: ${vars.AdminFunctionName}
      description: ${vars.Description}
      runtime: custom
      runtimeType: customize
      requestType: http
      cloudBuildType: Dockerfile
      sourceSubDir: admin-console
      port: 3000
      cpu: 1
      memorySize: 1024
      requestCpu: 0.5
      requestMemory: 512
      diskSize: 1024
      timeout: 300
      instanceConcurrency: 50
      networkType: vpc
      environmentVariables:
        PENPOT_PUBLIC_URI: '${vars.PENPOT_PUBLIC_URI}'
        PENPOT_DATABASE_URI: 'postgresql://${vars.POSTGRES_HOST}:${vars.POSTGRES_PORT}/${vars.POSTGRES_DATABASE}?sslmode=${vars.POSTGRES_SSL_MODE}'
        PENPOT_DATABASE_USERNAME: '${vars.POSTGRES_USERNAME}'
        PENPOT_DATABASE_PASSWORD: '${vars.POSTGRES_PASSWORD}'
        PENPOT_SECRET_KEY: '${vars.PENPOT_SECRET_KEY}'
        PENPOT_INTERNAL_URI: '${vars.PENPOT_PUBLIC_URI}'
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ''
      requestEntry: ''
      startCmd: ''
      requestEntryDescribe: ''
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ''
  penpotBackend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName: ${vars.BackendFunctionName}
      description: ${vars.Description}
      runtime: custom
      runtimeType: customize
      requestType: http
      cloudBuildType: Dockerfile
      sourceSubDir: backend
      port: 6060
      cpu: 4
      memorySize: 8192
      requestCpu: 0.5
      requestMemory: 512
      diskSize: 1024
      timeout: 300
      instanceConcurrency: 50
      networkType: vpc
      environmentVariables:
        PENPOT_PUBLIC_URI: '${vars.PENPOT_PUBLIC_URI}'
        POSTGRES_HOST: '${vars.POSTGRES_HOST}'
        POSTGRES_PORT: '${vars.POSTGRES_PORT}'
        POSTGRES_DATABASE: '${vars.POSTGRES_DATABASE}'
        POSTGRES_USERNAME: '${vars.POSTGRES_USERNAME}'
        POSTGRES_PASSWORD: '${vars.POSTGRES_PASSWORD}'
        POSTGRES_SSL_MODE: '${vars.POSTGRES_SSL_MODE}'
        REDIS_HOST: '${vars.REDIS_HOST}'
        REDIS_PORT: '${vars.REDIS_PORT}'
        REDIS_USERNAME: '${vars.REDIS_USERNAME}'
        REDIS_PASSWORD: '${vars.REDIS_PASSWORD}'
        REDIS_DATABASE: '${vars.REDIS_DATABASE}'
        S3_HOST: '${vars.S3_HOST}'
        S3_PORT: '${vars.S3_PORT}'
        S3_BUCKET: '${vars.S3_BUCKET}'
        S3_REGION: '${vars.S3_REGION}'
        S3_AK: '${vars.S3_AK}'
        S3_SK: '${vars.S3_SK}'
        S3_ENDPOINT: '${vars.S3_ENDPOINT}'
        PENPOT_SECRET_KEY: '${vars.PENPOT_SECRET_KEY}'
        PENPOT_ADMIN_CONSOLE_URI: 'http://${resources.penpotAdminConsole.output.httpTriggerUrl}'
        APPMKT_ALLOW_REGISTRATION: '${vars.APPMKT_ALLOW_REGISTRATION}'
        PENPOT_FILE_DATA_BACKEND: 'db'
        PENPOT_TELEMETRY_ENABLED: 'false'
        PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '33554432'
        JVM_OPTS: -Xms256m -Xmx4096m
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ''
      requestEntry: ''
      startCmd: ''
      requestEntryDescribe: ''
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ''
  penpotFrontend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName: ${vars.FrontendFunctionName}
      description: ${vars.Description}
      runtime: custom
      runtimeType: customize
      requestType: http
      cloudBuildType: Dockerfile
      sourceSubDir: frontend
      port: 8080
      cpu: 1
      memorySize: 1024
      requestCpu: 0.5
      requestMemory: 512
      diskSize: 1024
      timeout: 300
      instanceConcurrency: 50
      networkType: vpc
      environmentVariables:
        PENPOT_PUBLIC_URI: '${vars.PENPOT_PUBLIC_URI}'
        PENPOT_BACKEND_URI: 'http://${resources.penpotBackend.output.httpTriggerUrl}'
        PENPOT_ADMIN_CONSOLE_URI: 'http://${resources.penpotAdminConsole.output.httpTriggerUrl}'
        APPMKT_ALLOW_REGISTRATION: '${vars.APPMKT_ALLOW_REGISTRATION}'
        PENPOT_DISABLE_IPV6_LISTEN: 'true'
        PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '33554432'
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ''
      requestEntry: ''
      startCmd: ''
      requestEntryDescribe: ''
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ''
