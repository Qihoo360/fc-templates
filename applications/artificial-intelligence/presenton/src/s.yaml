edition: 3.0.0
name: presenton
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}

  OPENAI_URL: "{{OPENAI_URL}}"
  OPENAI_MODELNAME: "{{OPENAI_MODELNAME}}"
  OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
  
  APPMKT_APP_OWNER: "{{APPMKT_APP_OWNER || ''}}"
  APPMKT_APP_NAME: "{{APPMKT_APP_NAME || ''}}"
  APPMKT_APP_UUID: "{{APPMKT_APP_UUID || ''}}"

  SENSITIVE_MODE: "{{SENSITIVE_MODE}}"

  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  POLEFS_VOLUME_CAPACITY: {{POLEFS_VOLUME_CAPACITY || 50}}
  VOLUME_MOUNT_PATH: /data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  presenton:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 72000
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      sourceSubDir: presenton
      nasAccessMode: ReadWriteOncePod
      cloudBuildType: Dockerfile
      port: 8080
      functionName: ${vars.FunctionName}
      environmentVariables:
        LLM: custom
        CUSTOM_LLM_URL: ${vars.OPENAI_URL}
        CUSTOM_MODEL: ${vars.OPENAI_MODELNAME}
        CUSTOM_LLM_API_KEY: ${vars.OPENAI_API_KEY}
        MIGRATE_DATABASE_ON_STARTUP: true
        DISABLE_ANONYMOUS_TRACKING: true
        CAN_CHANGE_KEYS: true
        APIMKT_SENSTIVE_MODE: "${vars.SENSITIVE_MODE}"
        APPMKT_APP_OWNER: "${vars.APPMKT_APP_OWNER}"
        APPMKT_APP_NAME: "${vars.APPMKT_APP_NAME}"
        APPMKT_APP_UUID: "${vars.APPMKT_APP_UUID}"
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      networkType: vpc
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
