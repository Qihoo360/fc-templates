Edition: 3.0.0
Type: Project
Name: open-webui
Provider:
  - fc
Version: 0.0.3
Description: Open WebUI 是一个可扩展、功能丰富且用户友好的自托管AI平台，旨在完全离线操作。它支持 Ollama 和 OpenAI兼容API 等各种 LLM 运行器，内置 RAG 推理引擎，使其成为强大的 AI 部署解决方案。。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/open-webui
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      x-cate: resourceCate
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: open-webui-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless open-webui"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""