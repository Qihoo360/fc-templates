Edition: 3.0.0
Type: Project
Name: ragflow
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 RagFlow 一款基于深度文档理解构建的开源 RAG（Retrieval-Augmented Generation）引擎，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/ragflow
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - functionName
    - mysqlHost
    - mysqlDatabaseName
    - mysqlDatabasePort
    - mysqlUserName
    - mysqlPassword
    - elasticHost
    - elasticPort
    - elasticUserName
    - elasticPassword
    - minioHost
    - minioConsolePort
    - minioUserName
    - minioPassword
    - redisHost
    - redisPort
    - redisPassword
    - redisDB
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: ragflow-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless ragflow"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    mysqlHost:
      title: 数据库名 Host
      type: string
      default: 127.0.0.1
      description: 数据库地址
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlDatabaseName:
      title: 数据库名
      type: string
      default: db-test
      description: 数据库名
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlDatabasePort:
      title: 数据库端口
      type: integer
      default: 3306
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: 数据库端口
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlUserName:
      title: 数据库用户名
      type: string
      default: root
      description: 数据库用户名
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    mysqlPassword:
      title: 数据库密码
      type: secret
      description: 数据库密码
      x-cate: applicationCate
      x-label: mysqlLabel
      x-formitem:
        type: input
    elasticHost:
      title: Elasticsearch Host
      type: string
      default: http(s)://ip
      description: Elasticsearch 服务地址，例如：http(s)://ip，确保 Elasticsearch 的版本 >= 8.11.3
      x-cate: applicationCate
      x-label: esLabel
      x-formitem:
        type: input
    elasticPort:
      title: Elasticsearch 端口
      type: integer
      default: 9200
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: Elasticsearch 端口
      x-cate: applicationCate
      x-label: esLabel
      x-formitem:
        type: input
    elasticUserName:
      title: Elasticsearch 用户名
      type: string
      default: elastic
      description: Elasticsearch 用户名
      x-cate: applicationCate
      x-label: esLabel
      x-formitem:
        type: input
    elasticPassword:
      title: Elasticsearch 密码
      type: secret
      description: Elasticsearch 密码
      x-cate: applicationCate
      x-label: esLabel
      x-formitem:
        type: input
    minioHost:
      title: MinIO Host
      type: string
      description: MinIO 服务地址
      x-cate: applicationCate
      x-label: minioLabel
      x-formitem:
        type: input
    minioConsolePort:
      title: MinIO 端口
      type: integer
      default: 9000
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: MinIO console 端口
      x-cate: applicationCate
      x-label: minioLabel
      x-formitem:
        type: input
    minioUserName:
      title: MinIO 用户名
      type: string
      default: admin
      description: MinIO 用户名
      x-cate: applicationCate
      x-label: minioLabel
      x-formitem:
        type: input
    minioPassword:
      title: MinIO 密码
      type: secret
      description: MinIO 密码
      x-cate: applicationCate
      x-label: minioLabel
      x-formitem:
        type: input
    redisHost:
      title: Redis Host
      type: string
      description: Redis 服务地址
      x-cate: applicationCate
      x-label: redisLabel
      x-formitem:
        type: input
    redisPort:
      title: Redis 端口
      type: integer
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: Redis 端口
      x-cate: applicationCate
      x-label: redisLabel
      x-formitem:
        type: input
    redisPassword:
      title: Redis 密码
      type: secret
      description: Redis 密码
      x-cate: applicationCate
      x-label: redisLabel
      x-formitem:
        type: input
    redisDB:
      title: Redis DB
      type: integer
      pattern: "^\\d+$"
      description: Redis DB 编号
      x-cate: applicationCate
      x-label: redisLabel
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  mysqlLabel:
    title: "MySQL 配置"
    description: "部署应用前，请添加数据库授权，具体步骤可咨询管理人员。"
  esLabel:
    title: "Elasticsearch 配置"
    description: "应用使用了 Elasticsearch 的新特性，确保 Elasticsearch 的版本 >= 8.11.3，具体步骤可咨询管理人员。"
  minioLabel:
    title: "MinIO 配置"
    description: ""
  redisLabel:
    title: "Redis 配置"
    description: ""