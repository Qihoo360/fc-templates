Edition: 3.0.0
Type: Project
Name: ragflow
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 RagFlow 实现基于深度理解的文档问答。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/ragflow
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - functionName
    - DataBase
    - mysqlHost
    - mysqlDatabaseName
    - mysqlDatabasePort
    - mysqlUserName
    - mysqlPassword
    - LogStorage
    - elasticHost
    - elasticPort
    - elasticUserName
    - elasticPassword
    - minioHost
    - minioConsolePort
    - minioUserName
    - minioPassword
    - CacheDB
    - redisHost
    - redisPort
    - redisPassword
    - redisDB
  properties:
    region:
      title: 地域
      type: string
      default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
        - cn-north-cu-1
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: ragflow-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless ragflow"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
        - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    mysqlHost:
      # title: 数据库名 Host
      type: string
      default: 127.0.0.1
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库主机地址
      x-formitem:
        type: input
    mysqlDatabaseName:
      # title: 数据库名
      type: string
      default: db-test
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库名
      x-formitem:
        type: input
    mysqlDatabasePort:
      # title: 数据库端口
      type: integer
      default: 3306
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库端口
      x-formitem:
        type: input
    mysqlUserName:
      # title: 数据库用户名
      type: string
      default: root
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库用户名
      x-formitem:
        type: input
    mysqlPassword:
      # title: 数据库密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库密码
      x-formitem:
        type: input
    LogStorage:
      # title: 对象存储配置
      type: string
      default: Elasticsearch
      description: ""
      enum:
        - Elasticsearch
      x-cate: applicationCate
      x-label: 日志配置
      x-placeholder: 请选择日志存储类型
      x-formitem:
        type: select
    elasticHost:
      # title: Elasticsearch Host
      type: string
      default: http(s)://127.0.0.1
      description: ""
      x-cate: applicationCate
      x-label: 日志配置
      x-placeholder: 请输入日志系统主机地址
      x-formitem:
        type: input
    elasticPort:
      # title: Elasticsearch 端口
      type: integer
      default: 9200
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: 日志配置
      x-placeholder: 请输入日志系统端口
      x-formitem:
        type: input
    elasticUserName:
      # title: Elasticsearch 用户名
      type: string
      default: elastic
      description: ""
      x-cate: applicationCate
      x-placeholder: 请输入日志系统用户名
      x-label: 日志配置
      x-formitem:
        type: input
    elasticPassword:
      # title: Elasticsearch 密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: 日志配置
      x-placeholder: 请输入日志系统密码
      x-formitem:
        type: input
    minioHost:
      # title: MinIO Host
      type: string
      description: ""
      x-cate: applicationCate
      x-label: MinIO配置
      x-placeholder: 请输入MinIO数据库主机地址
      x-formitem:
        type: input
    minioConsolePort:
      # title: MinIO 端口
      type: integer
      default: 9000
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: MinIO配置
      x-placeholder: 请输入MinIO数据库主机端口
      x-formitem:
        type: input
    minioUserName:
      # title: MinIO 用户名
      type: string
      default: admin
      description: ""
      x-cate: applicationCate
      x-label: MinIO配置
      x-placeholder: 请输入MinIO数据库用户名
      x-formitem:
        type: input
    minioPassword:
      # title: MinIO 密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: MinIO配置
      x-placeholder: 请输入MinIO数据库密码
      x-formitem:
        type: input
    CacheDB:
      # title: 缓存配置
      type: string
      default: Redis
      description: ""
      enum:
        - Redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    redisHost:
      # title: Redis Host
      type: string
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-placeholder: 请输入Redis主机地址
      x-formitem:
        type: input
    redisPort:
      # title: Redis 端口
      type: integer
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-placeholder: 请输入Redis主机端口
      x-formitem:
        type: input
    redisPassword:
      # title: Redis 密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: 缓存配置
      x-placeholder: 请输入Redis密码
      x-formitem:
        type: input
    redisDB:
      # title: Redis DB
      type: integer
      pattern: "^\\d+$"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-placeholder: 请输入Redis数据库
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  mysqlLabel:
    title: "MySQL 配置"
    description: "部署应用前，请添加数据库授权，具体步骤可咨询管理人员。"
  esLabel:
    title: "Elasticsearch 配置"
    description: "应用使用了 Elasticsearch 的新特性，确保 Elasticsearch 的版本 >= 8.11.3，具体步骤可咨询管理人员。"
  minioLabel:
    title: "MinIO 配置"
    description: ""
  redisLabel:
    title: "Redis 配置"
    description: ""
