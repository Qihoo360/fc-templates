# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: banana-slides
Organization: 函数计算 (FC)
Provider:
  - fc
Version: 1.0.0
Description: 基于 nano banana pro🍌 的原生 AI PPT 生成器
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/banana-slides
Tags:
  - AI
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 函数设置
  - region
  - FunctionName
  - Description

  # 持久存储
  - FileStorage
  - POLEFS_VOLUME
  - VOLUME_MOUNT_PATH
  - POLEFS_VOLUME_CREATE_USER

  properties:
    region:
      title: 部署区域
      type: string
      default: beijing
      description: 应用将部署到所选择的区域
      enum:
      - beijing
      - test-3
      x-cate: resourceCate
      x-reaction-properties:
      - POLEFS_VOLUME
      x-formitem:
        type: select

    FunctionName:
      title: 前端函数名
      type: string
      default: banana-slides-frontend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 名称只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input

    Description:
      title: 前端函数描述
      type: string
      default: "banana-slides frontend 函数"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input

    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: 文件存储类型
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-formitem:
        type: select

    POLEFS_VOLUME:
      type: string
      description: |
        保存应用数据的文件存储，如：'bjpdc-polefs/app/data'；注：复用存储时需要注意数据覆盖的问题
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: POLEFS_VOLUME_CREATE_USER
      x-formitem:
        type: input
        name: volume_unique_name
    POLEFS_VOLUME_CREATE_USER:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: 函数创建挂载卷的用户
      x-hidden: true

PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
