# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: mem0-v1
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 refly 快速搭建私有代理工作空​​间。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/refly
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - reflyApiFunctionName
    - reflyApi2FunctionName
    - reflyWebFunctionName
    - RedisDataBase
    - REDIS_PASSWORD
    - REDIS_HOST
    - REDIS_PORT
    - PGDataBase
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USERNAME
    - POSTGRES_PASSWORD
    - POSTGRES_DATABASE
    - POSTGRES_SCHEMA

    - MINIODataBase
    - MINIO_INTERAL_BUCKET
    - MINIO_EXTERNAL_BUCKET
    - MINIO_ENDPOINT
    - MINIO_PORT
    - MINIO_ACCESS_KEY
    - MINIO_SECRET_KEY
    - MINIO_USE_SSL
    - QDRANTDataBase
    - QDRANT_HOST
    - QDRANT_PORT
    - QDRANT_API_KEY
    - SEARXNG
    - SEARXNG_HOST
    - SEARXNG_PORT
    - ELASTICSEARCH
    - ELASTICSEARCH_HOST
    - ELASTICSEARCH_PORT
    - ELASTICSEARCH_USERNAME
    - ELASTICSEARCH_PASSWORD
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    reflyApiFunctionName:
      title: reflyApiFunctionName 函数名
      type: string
      default: refly-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入reflyApi 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    reflyApiDescription:
      title: reflyApi函数描述
      type: string
      default: "Serverless refly api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入reflyApi函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    reflyApi2FunctionName:
      title: reflyApi2FunctionName 函数名
      type: string
      default: refly-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入reflyApi2 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    reflyApi2Description:
      title: reflyApi2函数描述
      type: string
      default: "Serverless refly api2"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入reflyApi函数描述
      x-cate: resourceCate
      x-formitem:
        type: input  
    reflyWebFunctionName:
      title: reflyWebFunctionName 函数名
      type: string
      default: refly-web-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入reflyWeb 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    reflyWebDescription:
      title: reflyWeb函数描述
      type: string
      default: "Serverless refly web"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入reflyWeb函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    RedisDataBase:
