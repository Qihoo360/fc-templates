      type: string
      default: redis
      description: ""
      enum:
        - redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    REDIS_HOST:
