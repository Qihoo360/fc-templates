Edition: 3.0.0
Type: Project
Name: flowise
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 flowise AI（拖放 UI 来构建您的自定义LLM流程），快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/flowise
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - functionName
    - mysqlHost
    - mysqlDatabaseName
    - mysqlDatabasePort
    - mysqlAccountName
    - mysqlPassword
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: flowise-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless flowise"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    mysqlHost:
      # title: 数据库名 Host
      type: string
      default: 127.0.0.1
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库主机地址
      x-formitem:
        type: input
    mysqlDatabaseName:
      # title: 数据库名
      type: string
      default: db-test
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库名
      x-formitem:
        type: input
    mysqlDatabasePort:
      # title: 数据库端口
      type: integer
      default: 3306
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库端口
      x-formitem:
        type: input
    mysqlAccountName:
      # title: 数据库用户名
      type: string
      default: root
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库用户名
      x-formitem:
        type: input
    mysqlPassword:
      # title: 数据库密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库密码
      x-formitem:
        type: secret
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  mysqlLabel:
    title: "MySQL 配置"
    description: "部署应用前，请添加数据库授权，具体步骤可咨询管理人员。"