edition: 3.0.0
name: flowise-app
access: default
vars:
  region: {{region}}
  functionName: {{functionName}}
  description: {{description}}
resources:
  flowise-app:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName:  ${vars.functionName}
      description: ${vars.description}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 8080
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      code:
        templated_files:
            - flowise/packages/server/.env.dev
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: false
      scale:
        scale_config: 1
        min: 1
        max: 1
      sourceSubDir: flowise
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""