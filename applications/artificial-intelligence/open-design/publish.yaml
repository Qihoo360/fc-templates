# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: Open-Design
Organization: 函数计算 (FC)
Provider:
  - fc
Version: 1.0.0
Description: Open Design 是一个本地优先、开源、不锁模型、可高度定制的 AI 驱动前端 / UI 开发工具。它让你用一句话生成高质量代码，且完全掌控数据与模型选择。
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/open-design
Tags:
  - AI
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 函数设置
  - region
  - FunctionName
  - Description

  # 大语言模型
  - OPENAI_URL
  - OPENAI_MODELNAME
  - OPENAI_API_KEY

  # 持久存储
  - FileStorage
  - POLEFS_VOLUME
  - POLEFS_VOLUME_CREATE_USER

  properties:
    region:
      title: 部署区域
      type: string
      default: beijing
      description: 应用将部署到所选择的区域
      enum:
      - beijing
      - test-2
      - test-3
      x-cate: resourceCate
      x-reaction-properties:
      - POLEFS_VOLUME
      x-formitem:
        type: select

    FunctionName:
      title: 函数名
      type: string
      default: open-design-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 名称只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input

    Description:
      title: 函数描述
      type: string
      default: "Open Design AI 设计"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input

    SENSITIVE_MODE:
      type: boolean
      default: false
      description: |
        安全须知：根据《360集团数据安全管理制度》要求，严禁将公司二级及以上数据出公网。
        开启该选项才能通过 ACL 打通内网/办公网基础服务，
        并且数据敏感则模型配置仅支持部署在内网的大模型！
      x-cate: applicationCate
      x-label: 数据是否敏感
      x-formitem:
        type: switch
        
    OPENAI_URL:
      type: string
      default: https://llm.api.zyuncs.com/v1
      description: 兼容 OpenAI 接口规范
      pattern: "https?://.*$"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入 BaseURL
      x-formitem:
        type: input

    OPENAI_MODELNAME:
      type: string
      default: 360-glm-4.7
      description: "语言模型名称"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入语言模型名称
      x-formitem:
        type: input

    OPENAI_API_KEY:
      type: secret
      default: ""
      description: "OpenAI API 密钥"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入 OpenAI APIKEY
      x-formitem:
        type: input

    FileStorage:
      type: string
      default: Polefs
      description: 文件存储类型
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-formitem:
        type: select

    POLEFS_VOLUME:
      title: 卷名称
      type: string
      description: |
        保存应用数据的文件存储，如：'bjpdc-polefs/app/data'；注：复用存储时需要注意数据覆盖的问题
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: POLEFS_VOLUME_CREATE_USER
      x-formitem:
        type: input
        name: volume_unique_name
    POLEFS_VOLUME_CREATE_USER:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: 函数创建挂载卷的用户
      x-hidden: true

PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
