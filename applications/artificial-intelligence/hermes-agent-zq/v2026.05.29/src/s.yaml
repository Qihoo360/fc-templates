edition: 3.0.0
name: hermes-agent
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}

  FUNCTION_CPU_CORES: {{FUNCTION_CPU_CORES || 2}}
  FUNCTION_MEMORY_SIZE: {{FUNCTION_MEMORY_SIZE || 4096}}

  API_SERVER_KEY: "{{API_SERVER_KEY}}"

  APPMKT_APP_OWNER: "{{APPMKT_APP_OWNER || ''}}"
  APPMKT_APP_NAME: "{{APPMKT_APP_NAME || ''}}"
  APPMKT_APP_UUID: "{{APPMKT_APP_UUID || ''}}"

  TUITUI_APP_ID: "{{TUITUI_APP_ID || ''}}"
  TUITUI_APP_SECRET: "{{TUITUI_APP_SECRET || ''}}"
  TUITUI_ALLOWED_USERS: "{{TUITUI_ALLOWED_USERS || ''}}"

  OPENAI_URL: "{{OPENAI_URL}}"
  OPENAI_MODELNAME: "{{OPENAI_MODELNAME}}"
  OPENAI_API_KEY: "{{OPENAI_API_KEY}}"

  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  hermes-agent:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: ${vars.FUNCTION_MEMORY_SIZE}
      cpu: ${vars.FUNCTION_CPU_CORES}
      requestCpu: 0.5
      requestMemory: 1024
      diskSize: 512
      timeout: 72000
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      sourceSubDir: hermes-agent
      cloudBuildType: Dockerfile
      port: 8080
      functionName: ${vars.FunctionName}
      environmentVariables:
        APPMKT_APP_OWNER: "${vars.APPMKT_APP_OWNER}"
        APPMKT_APP_NAME: "${vars.APPMKT_APP_NAME}"
        APPMKT_APP_UUID: "${vars.APPMKT_APP_UUID}"

        TUITUI_APP_ID: "${vars.TUITUI_APP_ID}"
        TUITUI_APP_SECRET: "${vars.TUITUI_APP_SECRET}"
        TUITUI_ALLOWED_USERS: "${vars.TUITUI_ALLOWED_USERS}"

        API_SERVER_KEY: "${vars.API_SERVER_KEY}"

        OPENAI_PROVIDER: appmkt
        OPENAI_URL: ${vars.OPENAI_URL}
        HERMES_DEFAULT_MODEL: ${vars.OPENAI_MODELNAME}
        APPMKT_API_KEY: ${vars.OPENAI_API_KEY}
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      networkType: vpc
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
