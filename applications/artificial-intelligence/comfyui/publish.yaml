Edition: 3.0.0
Type: Project
Effective: Public
Name: comfyui
Provider:
  - fc
Version: 0.0.1
Description: 这是一个基于Comfyui实现用大模型生成图像的示例
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/comfyui
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
    # 必填项
    - region
    - functionName
    - FileStorage
    - functionPolefsVolumn
    - afunctionMountDir
    - afunctionVolCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
        - cn-north-cu-1
      x-cate: resourceCate
      x-reaction-properties:
        - functionPolefsVolumn
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: comfyui-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless comfyui"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
        - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    functionPolefsVolumn:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-placeholder: 函数挂载 PoleFS 卷名称
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: afunctionVolCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    afunctionMountDir:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/mnt/ComfyUI/models"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    afunctionVolCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
