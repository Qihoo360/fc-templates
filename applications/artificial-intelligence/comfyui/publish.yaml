Edition: 3.0.0
Type: Project
Effective: Public
Name: comfyui
Provider:
  - fc
Version: 0.0.1
Description: 本案例是将 comfyui ，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/fc-app-test/applications/artificial-intelligence/comfyui
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
    # 必填项
    - region
    - functionName
    - functionPolefsVolumn
    - afunctionMountDir
    - afunctionVolCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-reaction-properties:
        - functionPolefsVolumn
      x-formitem:
        type: select
    functionPolefsVolumn:
      title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: PoleFS 卷名称
      x-cate: applicationCate
      x-label: nasLabel
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: afunctionVolCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    afunctionMountDir:
      title: 函数挂载路径
      type: string
      description: 函数挂载路径
      default: "/mnt/ComfyUI/models"
      x-cate: applicationCate
      x-label: nasLabel
      x-formitem:
        type: input
    afunctionVolCreateUser:
      title: 函数挂载的创建用户
      type: string
      default: ""
      description: 卷的创建用户
      x-cate: applicationCate
      x-label: nasLabel
      x-hidden: true
    functionName:
      title: 函数名
      type: string
      default: comfyui-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless comfyui"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
