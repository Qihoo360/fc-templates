# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: dify-v3
Provider:
- fc
Version: 0.0.3
Description: 该示例通过 Dify 可快速搭建生产级的生成式 AI 应用。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/dify160
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
    - 创建函数

Authorizations:
  roles:
    - id: owner
      name: 所有者
      description: |-
        完整的工作空间控制权。每个工作空间只有一个所有者。
        控制所有团队成员、模型供应商，并可以删除工作空间。无法将所有权转让给其他成员。
      scopes: []
    - id: admin
      name: 管理员
      description: |-
        团队和资源管理。
        可以添加/移除团队成员、配置模型供应商、管理所有应用并管理集成。无法更改成员角色。
      scopes: []
    - id: editor
      name: 编辑者
      description: |-
        应用开发。可以创建、编辑和删除应用，管理知识库，并使用所有工作空间工具。无法管理团队成员或配置供应商。
      scopes: []
    - id: normal
      name: 普通成员
      description: |-
        仅使用应用。可以使用已发布的应用和有权访问的工具。无法创建或修改应用。
      scopes: []


Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - difySandboxFunctionName
  - difyPluginDaemonFunctionName
  - difyApiFunctionName
  - difyWebFunctionName
  - DifyCustomDomain
  - CacheDB
  - REDIS_PASSWORD
  - REDIS_HOST
  - REDIS_PORT
  - REDIS_DATABASE
  - REDIS_DATABASE_CELERY
  - DifyDBSCHEME
  - POSTGRES_PASSWORD
  - POSTGRES_HOST
  - POSTGRES_PORT
  - DifyDBPluginDataBase
  - POSTGRES_DATABASE
  - POSTGRES_SSL_MODE
  - ObjectStorage
  - S3_ENDPOINT
  - S3_BUCKET
  - S3_REGION
  - S3_AK
  - S3_SK
  - FileStorage
  - POLEFS_VOLUME
  - POLEFS_MOUNT_PATH
  - PolefsVolumeCreateUse
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    difySandboxFunctionName:
      title: DifySandbox 函数名
      type: string
      default: dify-sandbox-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入DifySandbox 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    difySandboxDescription:
      title: DifySandbox函数描述
      type: string
      default: "Serverless dify sandbox"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入DifySandbox函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    difyPluginDaemonFunctionName:
      title: difyPluginDaemon 函数名
      type: string
      default: dify-plugindaemon-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入difyPluginDaemon 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    difyPluginDaemonDescription:
      title: difyPluginDaemon函数描述
      type: string
      default: "Serverless dify plugin daemon"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入difyPluginDaemon函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    difyApiFunctionName:
      title: DifyApi 函数名
      type: string
      default: dify-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入DifyApi 函数名
