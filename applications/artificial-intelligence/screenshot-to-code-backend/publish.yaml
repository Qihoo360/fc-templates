Edition: 3.0.0
Type: Project
Name: screenshot-to-code-backend
Provider:
  - fc
Version: 0.0.3
Description: Convert any screenshot or design to clean code (with support for most frameworks)
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/screenshot-to-code-backend
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
    - apiKey
  properties:
    region:
      title: 地域
      type: string
      default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
        - cn-north-cu-1
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: screenshot-to-code-backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-formitem:
        type: input
    oneapiUrl:
      title: oneapi 地址
      type: string
      default: ""
      pattern: "http.*"
      description: http/https 地址
      x-formitem:
        type: input
    apiKey:
      title: api key
      type: string
      default: ""
      pattern: ".*"
      description: sk-xxxx
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless screenshot-to-code-backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-formitem:
        type: input
