edition: 3.0.0
name: pandas-ai-app
access: default
vars:
  region: {{region}}
  serverFunctionName: {{serverFunctionName}}
  serverDescribe: {{serverDescription}}
  clientFunctionName: {{clientFunctionName}}
  clientDescribe: {{clientDescription}}
resources:
  server:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.serverDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8080
      functionName: ${vars.serverFunctionName}
      sourceSubDir: code/server
      code:
        templated_files:
          - code/server/.env
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  client:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.clientDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8080
      functionName: ${vars.clientFunctionName}
      sourceSubDir: code/client
      code:
        templated_files:
          - code/client/.env
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
