# yaml-language-server: $schema=../../../schemas/publish-schema.json
Edition: 3.0.0
Type: Project
Effective: Public
Name: pandas-ai-v3
Provider:
- fc
Version: 0.0.3
Description: 这是一个通过PandasAI实现用自然语言向数据提问的示例，该示例可图形化数据，处理数据并提高数据质量。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/pandas-ai
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - serverFunctionName
  - clientFunctionName
  - DataBase
  - POSTGRES_URL
  - OPENAI_URL
  - OPENAI_API_KEY
  - ServerCustomDomain
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    serverFunctionName:
      title: Server函数名
      type: string
      default: pandas-ai-server-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入server函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    serverDescription:
      title: server描述
      type: string
      default: "Serverless pandas-ai server"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入server函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    clientFunctionName:
      title: client函数名
      type: string
      default: pandas-ai-client-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入client函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    clientDescription:
      title: client描述
      type: string
      default: "Serverless pandas-ai client"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入client函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: postgresql
      description: ""
      enum:
      - postgresql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    POSTGRES_URL:
      # title: POSTGRES_URL
      type: string
      default: ""
      description: "例如：postgresql+asyncpg://pandasai:xxx@postgresql:5432/pandasai-db"
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库地址
      x-formitem:
        type: input
    OPENAI_URL:
      # title: OPENAI_URL
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: OPENAI_URL
      x-formitem:
        type: input
    OPENAI_API_KEY:
      # title: OPENAI_API_KEY
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: OPENAI_API_KEY
      x-formitem:
        type: input
    ServerCustomDomain:
      # title: server自定义域名
      type: string
      default: ""
      description: "例如：http://localhost:8000"
      x-cate: applicationCate
      x-label: 自定义域名
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
