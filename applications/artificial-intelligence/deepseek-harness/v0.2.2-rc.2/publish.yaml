# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: DeepSeek Harness
Organization: 函数计算 (FC)
Provider:
  - fc
Version: 0.2.2-rc.2
Description: DeepSeek Harness Web agent 应用，可以通过插件和 Skill 扩展更多能力。
HomePage: https://github.com/deepseek-ai/deepseek-harness
Tags:
  - AI
  - Agent
Category: 人工智能
Service:
  FC:
    Authorities:
      - 创建函数
ResourceSpecs:
  - micro
  # - light
  # - shared
  # - dedicated

Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - FunctionName
    - Description

    - DSH_WEB_AUTH_TOKEN

    # 大语言模型
    - OPENAI_URL
    - OPENAI_MODELNAME
    - OPENAI_API_KEY

    # 持久存储
    - FileStorage
    - POLEFS_VOLUME
    - POLEFS_VOLUME_CAPACITY
    - POLEFS_VOLUME_CREATE_USER
  properties:
    region:
      title: 部署区域
      type: string
      default: beijing
      description: 应用将部署到所选择的区域
      enum:
      - beijing
      - test-2
      - test-3
      x-cate: resourceCate
      x-reaction-properties:
      - POLEFS_VOLUME
      x-formitem:
        type: select

    FunctionName:
      title: 函数名
      type: string
      default: "deepseek-harness-${default-suffix}"
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 名称只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input

    Description:
      x-hidden: true
      title: 函数描述
      type: string
      default: "DeepSeek Harness Web 应用"
      description: 最大长度为 255 个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input

    FUNCTION_CPU_CORES:
      title: CPU 规格
      description: CPU 核心数
      type: integer
      default: 2
      maximum: 8
      minimum: 2
      x-placeholder: 请输入 CPU 核心数
      x-cate: resourceCate
      x-formitem:
        type: input
      x-hidden: true

    FUNCTION_MEMORY_SIZE:
      title: 内存规格
      description: 内存大小，单位 MB
      type: integer
      default: 4096
      maximum: 16384
      minimum: 4096
      x-placeholder: 请输入内存大小，单位 MB
      x-cate: resourceCate
      x-formitem:
        type: input
      x-hidden: true

    DSH_WEB_AUTH_TOKEN:
      title: Web 登录 Token
      type: secret
      default: gw-${default-suffix}
      pattern: "^[^!\\d].{4,64}$"
      description: |
        最少 5 个字符，最大长度为 64 个字符，开头不能是 ! 字符和数字；
      x-placeholder: 请输入 Token
      x-cate: applicationCate
      x-random: true
      x-label: Web Token
      x-formitem:
        type: input

    SENSITIVE_MODE:
      type: boolean
      default: false
      description: |
        安全须知：根据《360集团数据安全管理制度》要求，严禁将公司二级及以上数据出公网。
        开启该选项才能通过 ACL 打通内网/办公网基础服务，
        并且数据敏感则模型配置仅支持部署在内网的大模型！
      x-cate: applicationCate
      x-label: 数据是否敏感
      x-formitem:
        type: switch

    OPENAI_URL:
      title: 模型服务地址
      type: string
      default: https://llm.api.zyuncs.com/v1
      description: 兼容 OpenAI 接口规范
      pattern: "https?://.*$"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入 BaseURL
      x-formitem:
        type: input

    OPENAI_MODELNAME:
      title: 语言模型名称
      type: string
      default: z-ai/glm-5.3
      description: "语言模型名称"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入语言模型名称
      x-formitem:
        type: input

    OPENAI_API_KEY:
      title: 模型调用密钥
      type: secret
      default: ""
      description: "OpenAI API 密钥"
      x-cate: applicationCate
      x-label: 大语言模型
      x-restype: openai
      x-placeholder: 请输入 OpenAI APIKEY
      x-formitem:
        type: input

    FileStorage:
      type: string
      default: Polefs
      description: 文件存储类型
      enum:
      - Polefs
      x-cate: resourceCate
      x-label: 文件存储
      x-restype: polefs
      x-formitem:
        type: select

    POLEFS_VOLUME:
      title: 卷名称
      type: string
      description: |
        保存应用数据的文件存储，如：'bjpdc-polefs/app/data'；注：复用存储时需要注意数据覆盖的问题
      x-cate: resourceCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: POLEFS_VOLUME_CREATE_USER
      x-formitem:
        type: input
        name: volume_unique_name

    POLEFS_VOLUME_CAPACITY:
      type: integer
      default: 50
      description: |
        存储卷容量，单位 GB；注：创建新的存储卷时需要指定容量大小，复用存储卷时该配置项不生效
      x-cate: resourceCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-formitem:
        type: input
      x-hidden: true
    POLEFS_VOLUME_CREATE_USER:
      type: string
      default: ""
      description: ""
      x-cate: resourceCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: 函数创建挂载卷的用户
      x-hidden: true

    APPMKT_APP_OWNER:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 应用信息
      x-hidden: true

    APPMKT_APP_NAME:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 应用信息
      x-hidden: true

    APPMKT_APP_UUID:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 应用信息
      x-hidden: true

PropertyDescription:
  resourceCate:
    title: 资源创建配置
    description: ""
  applicationCate:
    title: 应用配置
    description: 应用运行参数和模型服务配置。
