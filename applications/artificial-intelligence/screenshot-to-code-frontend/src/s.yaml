edition: 3.0.0
name: kotaemon-app
access: default
vars:
  region: {{region}}
  describe: {{description}}
  functionName: {{functionName}}
  wsBackendUrl: {{wsBackendUrl}}
  httpBackendUrl: {{httpBackendUrl}}
resources:
  framework:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.describe}
      runtime: custom
      memorySize: 10240
      cpu: 4
      diskSize: 5120
      timeout: 100
      instanceConcurrency: 100
      port: 5173
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.functionName}
      sourceSubDir: screenshot-to-code/frontend
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        VITE_WS_BACKEND_URL: ${vars.wsBackendUrl}
        VITE_HTTP_BACKEND_URL: ${vars.httpBackendUrl}
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
