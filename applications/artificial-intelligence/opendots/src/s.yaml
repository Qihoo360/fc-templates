edition: 3.0.0
name: opendots
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}

  OWNER_TOKEN: "{{OWNER_TOKEN}}"
  OWNER_ID: "{{OWNER_ID}}"
  INTELLIGENCE_API_KEY: "{{INTELLIGENCE_API_KEY}}"
  INTELLIGENCE_API_URL: "{{INTELLIGENCE_API_URL}}"
  INTELLIGENCE_GATEWAY_WS_URL: "{{INTELLIGENCE_GATEWAY_WS_URL}}"
  OPENAI_BASE_URL: "{{OPENAI_BASE_URL}}"
  OPENAI_MODEL: "{{OPENAI_MODEL}}"
  OPENAI_API_KEY: "{{OPENAI_API_KEY}}"
  AGENT_RUN_TIMEOUT_MS: {{AGENT_RUN_TIMEOUT_MS}}

  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  opendots:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 2
      requestCpu: 0.5
      requestMemory: 1024
      diskSize: 512
      timeout: 72000
      instanceConcurrency: 20
      requestType: http
      runtimeType: customize
      sourceSubDir: code/opendots
      cloudBuildType: Dockerfile
      port: 4310
      functionName: ${vars.FunctionName}
      environmentVariables:
        NODE_ENV: production
        HOST: 0.0.0.0
        PORT: "4310"
        DATABASE_PATH: /data/opendots.sqlite
        OWNER_TOKEN: ${vars.OWNER_TOKEN}
        OWNER_ID: ${vars.OWNER_ID}
        CPK_INTELLIGENCE_API_KEY: ${vars.INTELLIGENCE_API_KEY}
        INTELLIGENCE_API_URL: ${vars.INTELLIGENCE_API_URL}
        INTELLIGENCE_GATEWAY_WS_URL: ${vars.INTELLIGENCE_GATEWAY_WS_URL}
        OPENAI_BASE_URL: ${vars.OPENAI_BASE_URL}
        OPENAI_MODEL: ${vars.OPENAI_MODEL}
        OPENAI_API_KEY: ${vars.OPENAI_API_KEY}
        AGENT_RUN_TIMEOUT_MS: ${vars.AGENT_RUN_TIMEOUT_MS}
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      networkType: vpc
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
