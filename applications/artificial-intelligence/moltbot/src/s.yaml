edition: 3.0.0
name: moltbot
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}

  CLAWDBOT_GATEWAY_TOKEN: {{CLAWDBOT_GATEWAY_TOKEN}}
  CLAWDBOT_UI_ALLOW_INSECURE_AUTH: {{CLAWDBOT_UI_ALLOW_INSECURE_AUTH}}

  OPENAI_URL: {{OPENAI_URL}}
  OPENAI_MODELNAME: {{OPENAI_MODELNAME}}
  OPENAI_API_KEY: {{OPENAI_API_KEY}}

  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  banana:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      sourceSubDir: moltbot
      cloudBuildType: Dockerfile
      port: 18789
      functionName: ${vars.FunctionName}
      environmentVariables:
        APPDATA: ${vars.VOLUME_MOUNT_PATH}

        CLAWDBOT_GATEWAY_TOKEN: ${vars.CLAWDBOT_GATEWAY_TOKEN}
        CLAWDBOT_UI_ALLOW_INSECURE_AUTH: ${vars.CLAWDBOT_UI_ALLOW_INSECURE_AUTH}

        OPENAI_PROVIDER: appmkt
        OPENAI_URL: ${vars.OPENAI_URL}
        OPENAI_MODELNAME: ${vars.OPENAI_MODELNAME}
        OPENAI_API_KEY: ${vars.OPENAI_API_KEY}
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}