Edition: 3.0.0
Type: Project
Name: n8n
Provider:
- fc
Version: 0.0.3
Description: 这是一个创建 n8n 工作流自动化平台的示例,n8n 让您能够构建强大的自动化流程，同时完全控制您的数据和部署。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/n8n11191
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - functionName
  - FileStorage
  - POLEFS_VOLUME
  - POLEFS_MOUNT_PATH
  - polefsVolumeCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      x-cate: resourceCate
      enum:
      - beijing
      x-reaction-properties:
      - POLEFS_VOLUME
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: n8n-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    description:
      title: 函数描述
      type: string
      default: "Serverless n8n"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    POLEFS_VOLUME:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    POLEFS_MOUNT_PATH:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/home/node/.n8n"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    PolefsVolumeCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"