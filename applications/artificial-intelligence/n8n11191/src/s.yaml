edition: 3.0.0
name: n8n-app
access: default
vars:
  region: {{ region }}
  functionName: {{functionName}}
  description: {{description}}
  PolefsVolume: {{POLEFS_VOLUME}}
  MountDir: {{POLEFS_MOUNT_PATH}}
  VolCreateUser: {{PolefsVolumeCreateUser}}
resources:
  n8n-service:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: ${vars.description}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 5678
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      sourceSubDir: n8n
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      environmentVariables:
        N8N_PROTOCOL: https
      logConfig:
        isOpen: false
      scale:
        scale_config: 1
        min: 1
        max: 1
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.PolefsVolume}
          mountDir: ${vars.MountDir}
          createUserName: ${vars.VolCreateUser}