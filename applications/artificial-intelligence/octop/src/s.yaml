edition: 3.0.0
name: octop
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}
  OCTOP_DEFAULT_PASSWORD: '{{OCTOP_DEFAULT_PASSWORD}}'
  OCTOP_ADMIN_USERNAME: '{{OCTOP_ADMIN_USERNAME}}'
  OPENAI_URL: '{{OPENAI_URL}}'
  OPENAI_MODELNAME: '{{OPENAI_MODELNAME}}'
  OPENAI_API_KEY: '{{OPENAI_API_KEY}}'
  POLEFS_VOLUME: '{{POLEFS_VOLUME}}'
  POLEFS_VOLUME_CREATE_USER: '{{POLEFS_VOLUME_CREATE_USER}}'
  VOLUME_MOUNT_PATH: /data
resources:
  octop:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 2
      diskSize: 1024
      timeout: 72000
      instanceConcurrency: 20
      requestType: http
      runtimeType: customize
      sourceSubDir: octop
      cloudBuildType: Dockerfile
      port: 8088
      functionName: ${vars.FunctionName}
      environmentVariables:
        HOME: /data/octop
        OCTOP_HOME: /data/octop
        OCTOP_APPMKT_MODE: '1'
        OCTOP_BIND_HOST: 0.0.0.0
        OCTOP_PORT: '8088'
        OCTOP_DATABASE_DRIVER: sqlite
        OCTOP_DATABASE_SQLITE_PATH: /data/octop/octop.db
        OCTOP_DEFAULT_PASSWORD: ${vars.OCTOP_DEFAULT_PASSWORD}
        OCTOP_ADMIN_USERNAME: ${vars.OCTOP_ADMIN_USERNAME}
        OPENAI_BASE_URL: ${vars.OPENAI_URL}
        OPENAI_MODEL_NAME: ${vars.OPENAI_MODELNAME}
        OPENAI_API_KEY: ${vars.OPENAI_API_KEY}
        LANGFUSE_TRACING_ENABLED: 'false'
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ''
      requestEntry: ''
      startCmd: ''
      requestEntryDescribe: ''
      networkType: vpc
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods: [GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH]
            disable_url_internet: true
            auth_config: ''
