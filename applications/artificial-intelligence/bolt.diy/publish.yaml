# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Name: bolt-diy
Provider:
  - fc
Version: 0.0.3
Description: 这是一个用bolt.diy基于AI的全栈开发平台。
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/fc-app-test/applications/artificial-intelligence/bolt.diy
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
    - OPENAI_URL
    - OPENAI_API_KEY
    - OPENAI_MODELNAME
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: bolt-diy-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless bolt-diy"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    OPENAI_URL:
      type: string
      default: "http://your_api_url:port/v1/"
      pattern: "^https?://"
      description: "OPENAI 接口规范: http://your_api_url:port/v1/"
      x-cate: applicationCate
      x-label: 大模型配置
      x-restype: openai
      x-placeholder: OPENAI_URL
      x-formitem:
        type: input
    OPENAI_API_KEY:
      type: string
      default: ""
      description: "接口密钥"
      x-cate: applicationCate
      x-label: 大模型配置
      x-restype: openai
      x-placeholder: OPENAI_API_KEY
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"