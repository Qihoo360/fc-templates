# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: one-api-v3
Provider:
- fc
Version: 0.0.3
Description: 这是一个支持访问所有大模型的统一 OneAPI 示例。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/one-api
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - FunctionName
  - DataBase
  - MYSQL_DSN
  - SYNC_FREQUENCY
  - CacheDB
  - SESSION_SECRET
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
      - test-2
      - test-3
      - test-4
      - test-5
      - test-6
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: one-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    Description:
      title: 描述
      type: string
      default: "Serverless one-api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
      - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    MYSQL_DSN:
      # title: MYSQL_DSN
      type: string
      default: ""
      description: "例如：user:secret@host:port/database"
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入数据库地址
      x-formitem:
        type: input
    CacheDB:
      # title: 缓存配置
      type: string
      default: Redis
      description: ""
      enum:
      - Redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    REDIS_URL:
      # title: REDIS_URL
      type: string
      default: ""
      description: "例如：redis://default:redispw@localhost:49153"
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入缓存地址
      x-formitem:
        type: input
    SYNC_FREQUENCY:
      # title: SYNC_FREQUENCY
      type: string
      default: "60"
      description: "与数据库同步配置的频率，单位为秒"
      x-cate: applicationCate
      x-label: 同步频率
      x-placeholder: 请输入同步频率
      x-formitem:
        type: input
    SESSION_SECRET:
      # title: SESSION_SECRET
      type: secret
      default: "a72478d8-ecd7-11ef-bb31-5b258ab9a7ff"
      description: ""
      x-cate: applicationCate
      x-label: SESSION密钥
      x-placeholder: 请输入会话密钥
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
