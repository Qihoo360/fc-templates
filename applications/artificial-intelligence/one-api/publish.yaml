Edition: 3.0.0
Type: Project
Effective: Public
Name: one-api-v3
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 one-api，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/one-api
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - FunctionName
    - SQL_DSN
    - SYNC_FREQUENCY
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: one-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    Description:
      title: 描述
      type: string
      default: "Serverless one-api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    SQL_DSN:
      title: SQL_DSN
      type: string
      default: ""
      description: "SQL_DSN MySQL 数据库：SQL_DSN=root:123456@tcp(localhost:3306)/oneapi"
      x-cate: applicationCate
      x-label: one-api
      x-formitem:
        type: input
    REDIS_CONN_STRING:
      title: REDIS_CONN_STRING
      type: string
      default: ""
      description: "Redis 作为缓存数据库：REDIS_CONN_STRING=redis://default:redispw@localhost:49153"
      x-cate: applicationCate
      x-label: one-api
      x-formitem:
        type: input
    SYNC_FREQUENCY:
      title: SYNC_FREQUENCY
      type: string
      default: "60"
      description: "与数据库同步配置的频率，单位为秒：SYNC_FREQUENCY=60"
      x-cate: applicationCate
      x-label: one-api
      x-formitem:
        type: input
    SESSION_SECRET:
      title: SESSION_SECRET
      type: string
      default: "a72478d8-ecd7-11ef-bb31-5b258ab9a7ff"
      description: "会话密钥：SESSION_SECRET=random_uuid_string"
      x-cate: applicationCate
      x-label: one-api
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
