edition: 3.0.0
name: bisheng-app
access: default
vars:
  region: {{region}}
  bishengMinioFunctionName: {{bishengMinioFunctionName}}
  bishengMinioDescription: {{bishengMinioDescription}}
  bishengOfficeFunctionName: {{bishengOfficeFunctionName}}
  bishengOfficeDescription: {{bishengOfficeDescription}}
  bishengBackendFunctionName: {{bishengBackendFunctionName}}
  bishengBackendDescription: {{bishengBackendDescription}}
  bishengFrontendFunctionName: {{bishengFrontendFunctionName}}
  bishengFrontendDescription: {{bishengFrontendDescription}}
  workerNum: {{workerNum}}
  ELASTICSEARCH_HOST: {{ELASTICSEARCH_HOST}}
  ELASTICSEARCH_PORT: {{ELASTICSEARCH_PORT}}
  ELASTICSEARCH_USERNAME: {{ELASTICSEARCH_USERNAME}}
  ELASTICSEARCH_PASSWORD: {{ELASTICSEARCH_PASSWORD}}
  MILVUS_HOST: {{MILVUS_HOST}}
  MILVUS_PORT: {{MILVUS_PORT}}
  MILVUS_USERNAME: {{MILVUS_USERNAME}}
  MILVUS_PASSWORD: {{MILVUS_PASSWORD}}
  milvusSecure: {{milvusSecure}}
  milvusIsPartition: {{milvusIsPartition}}
  milvusPartitionSuffiix: {{milvusPartitionSuffiix}}
  REDIS_HOST: {{REDIS_HOST}}
  REDIS_PORT: {{REDIS_PORT}}
  REDIS_PASSWORD: {{REDIS_PASSWORD}}
  MYSQL_HOST: {{MYSQL_HOST}}
  MYSQL_PORT: {{MYSQL_PORT}}
  MYSQL_DATABASE: {{MYSQL_DATABASE}}
  MYSQL_USERNAME: {{MYSQL_USERNAME}}
  MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  bishengMinio:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.bishengMinioDescription}
      runtime: custom
      memorySize: 2048
      cpu: 1
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 9000
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.bishengMinioFunctionName}
      sourceSubDir: code/bisheng/docker/minio
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: /minio_data
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
  bishengOffice:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.bishengOfficeDescription}
      runtime: custom
      memorySize: 4096
      cpu: 2
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 80
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.bishengOfficeFunctionName}
      sourceSubDir: code/bisheng/docker/office
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        TZ: Asia/Shanghai
        JWT_ENABLED: "false"
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  bishengBackend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.bishengBackendDescription}
      runtime: custom
      memorySize: 16384
      cpu: 6
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 7860
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.bishengBackendFunctionName}
      sourceSubDir: code/bisheng/src/backend
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        BS_ELASTICSEARCH_SSL_VERIFY: '{"basic_auth": ("${vars.ELASTICSEARCH_USERNAME}", "${vars.ELASTICSEARCH_PASSWORD}")}'
        BS_ELASTICSEARCH_URL: http://${vars.ELASTICSEARCH_HOST}:${vars.ELASTICSEARCH_PORT}/
        BS_MILVUS_CONNECTION_ARGS: '{"host":"${vars.MILVUS_HOST}","port":"${vars.MILVUS_PORT}","user":"${vars.MILVUS_USERNAME}","password":"${vars.MILVUS_PASSWORD}","secure":${vars.milvusSecure}}'
        BS_MILVUS_IS_PARTITION: ${vars.milvusIsPartition}
        BS_MILVUS_PARTITION_SUFFIX: ${vars.milvusPartitionSuffiix}
        BS_DATABASE_URL: "mysql+pymysql://${vars.MYSQL_USERNAME}:${vars.MYSQL_PASSWORD}@${vars.MYSQL_HOST}:${vars.MYSQL_PORT}/${vars.MYSQL_DATABASE}?charset=utf8mb4"
        BS_REDIS_URL: "redis://:${vars.REDIS_PASSWORD}@${vars.REDIS_HOST}:${vars.REDIS_PORT}"
        BS_CELERY_REDIS_URL: "redis://:${vars.REDIS_PASSWORD}@${vars.REDIS_HOST}:${vars.REDIS_PORT}/1"
        BS_MINIO_ENDPOINT: "${resources.bishengMinio.output.httpTriggerUrl}"
        BS_MINIO_ACCESS_KEY: minioadmin
        BS_MINIO_SECRET_KEY: minioadmin
        BS_MINIO_CERT_CHECK: false
        BS_MINIO_SCHEMA: false
        USER_AGENT: "${vars.bishengBackendFunctionName}"
        BS_MINIO_SHAREPOINT: "${resources.bishengMinio.output.httpTriggerUrl}"
        BS_OFFICE_URL: "http://${resources.bishengOffice.output.httpTriggerUrl}"
        WORKER_NUM: ${vars.workerNum}
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: /app/data
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
  bishengFrontend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.bishengFrontendDescription}
      runtime: custom
      memorySize: 4096
      cpu: 2
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 3001
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.bishengFrontendFunctionName}
      sourceSubDir: code/bisheng/src/frontend
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        TZ: Asia/Shanghai
        BS_BACKEND_URL: "http://${resources.bishengBackend.output.httpTriggerUrl}"
        BS_MINIO_ENDPOINT: "${resources.bishengMinio.output.httpTriggerUrl}"
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
