# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: bisheng-backend
Provider:
  - fc
Version: 0.0.1
Description: 这是一个专攻办公场景的 LLM 应用开发平台
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/bisheng-backend
Tags:
  - AI
  - Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
    # 必填项
    - region
    - bishengMinioFunctionName
    - bishengMinioDescription
    - bishengOfficeFunctionName
    - bishengOfficeDescription
    - bishengBackendFunctionName
    - bishengBackendDescription
    - bishengFrontendFunctionName
    - bishengFrontendDescription
    - workerNum
    - ELASTICSEARCH_HOST
    - ELASTICSEARCH_PORT
    - ELASTICSEARCH_USERNAME
    - ELASTICSEARCH_PASSWORD
    - VectorDB
    - MILVUS_HOST
    - MILVUS_PORT
    - MILVUS_USERNAME
    - MILVUS_PASSWORD
    - milvusSecure
    - milvusIsPartition
    - milvusPartitionSuffiix
    - CacheDB
    - REDIS_HOST
    - REDIS_PORT
    - REDIS_PASSWORD
    - DataBase
    - MYSQL_HOST
    - MYSQL_PORT
    - MYSQL_DATABASE
    - MYSQL_USERNAME
    - MYSQL_PASSWORD
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
        - beijing
        - test-3
      x-cate: resourceCate
      x-reaction-properties:
        - functionPolefsVolumn
      x-formitem:
        type: select
    bishengMinioFunctionName:
      title: 函数名
      type: string
      default: bisheng-minio-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 bisheng minio 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengMinioDescription:
      title: 描述
      type: string
      default: "bisheng minio"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 bisheng minio 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengOfficeFunctionName:
      title: 函数名
      type: string
      default: bisheng-office-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 bisheng office 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengOfficeDescription:
      title: 描述
      type: string
      default: "bisheng office"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 bisheng office 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengBackendFunctionName:
      title: 函数名
      type: string
      default: bisheng-backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 bisheng office 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengBackendDescription:
      title: 描述
      type: string
      default: "bisheng backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 bisheng backend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengFrontendFunctionName:
      title: 函数名
      type: string
      default: bisheng-frontend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 bisheng office 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    bishengFrontendDescription:
      title: 描述
      type: string
      default: "bisheng frontend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 bisheng frontend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    workerNum:
      type: integer
      default: 2
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: "worker 进程数"
      x-cate: applicationCate
      x-label: backend 配置
      x-placeholder: 请输入 worker 进程数
      x-formitem:
        type: input
    ELASTICSEARCH_HOST:
      # title: Elasticsearch Host
      type: string
      description: ""
      x-cate: applicationCate
      x-label: ES 配置
      x-restype: elasticsearch
      x-placeholder: 请输入 ES 地址
      x-formitem:
        type: input
    ELASTICSEARCH_PORT:
      # title: Elasticsearch 端口
      type: integer
      default: 9200
      pattern: "^(?:[1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$"
      description: ""
      x-cate: applicationCate
      x-label: ES 配置
      x-restype: elasticsearch
      x-placeholder: 请输入 ES 端口
      x-formitem:
        type: input
    ELASTICSEARCH_USERNAME:
      # title: Elasticsearch 用户名
      type: string
      default: elastic
      description: ""
      x-cate: applicationCate
      x-placeholder: 请输入 ES 用户名称
      x-label: ES 配置
      x-restype: elasticsearch
      x-formitem:
        type: input
    ELASTICSEARCH_PASSWORD:
      # title: Elasticsearch 密码
      type: secret
      description: ""
      default: "123456"
      x-cate: applicationCate
      x-label: ES 配置
      x-restype: elasticsearch
      x-placeholder: 请输入 ES 密码
      x-formitem:
        type: input
    VectorDB:
      # title: 向量数据库配置
      type: string
      default: milvus
      description: 选择数据库类型
      enum:
        - milvus
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-formitem:
        type: select
    MILVUS_HOST:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus host
      x-formitem:
        type: input
    MILVUS_PORT:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus port
      x-formitem:
        type: input
    MILVUS_USERNAME:
      # title: milvus token
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus user
      x-formitem:
        type: input
    MILVUS_PASSWORD:
      # title: milvus token
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus password
      x-formitem:
        type: input
    milvusSecure:
      # title: milvus token
      type: string
      default: false
      description: 启用 TLS
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus secure
      x-formitem:
        type: switch
    milvusIsPartition:
      type: string
      default: true
      description: 启用 partition 模式
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: 启用 partition 模式
      x-formitem:
        type: switch
    milvusPartitionSuffiix:
      # title: milvus token
      type: string
      default: "1"
      description: partition 后缀名称
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-placeholder: partition 后缀名称
      x-formitem:
        type: input
    CacheDB:
      type: string
      default: redis
      description: 选择缓存类型
      enum:
        - redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-formitem:
        type: select
    REDIS_HOST:
      # title: REDIS_HOST
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redis主机地址
      x-formitem:
        type: input
    REDIS_PORT:
      # title: REDIS_PORT
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redisd主机端口
      x-formitem:
        type: input
    REDIS_PASSWORD:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入 redis password
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: 请选择数据库类型
      enum:
        - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-formitem:
        type: select
    MYSQL_HOST:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql host
      x-formitem:
        type: input
    MYSQL_PORT:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql port
      x-formitem:
        type: input
    MYSQL_DATABASE:
      # title: 数据库名 Host
      type: string
      default: "bisheng"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql database
      x-formitem:
        type: input
    MYSQL_USERNAME:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql user
      x-formitem:
        type: input
    MYSQL_PASSWORD:
      # title: 数据库名 Host
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql password
      x-formitem:
        type: input

    FileStorage:
      type: string
      default: Polefs
      description: 文件存储类型
      enum:
        - Polefs
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-formitem:
        type: select

    POLEFS_VOLUME:
      type: string
      description: |
        保存应用数据的文件存储，如：'bjpdc-polefs/app/data'；注：复用存储时需要注意数据覆盖的问题
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: POLEFS_VOLUME_CREATE_USER
      x-formitem:
        type: input
        name: volume_unique_name
    POLEFS_VOLUME_CREATE_USER:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: 函数创建挂载卷的用户
      x-hidden: true

PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
