edition: 3.0.0
name: dify-app
access: default
vars:
  region: {{region}}
  difySandboxFunctionName: {{difySandboxFunctionName}}
  difySandboxDescribe: {{difySandboxDescription}}
  difyApiFunctionName: {{difyApiFunctionName}}
  difyApiDescribe: {{difyApiDescription}}
  difyWebFunctionName: {{difyWebFunctionName}}
  difyWebDescribe: {{difyWebDescription}}
resources:
  difySandbox:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difySandboxDescribe}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8194
      functionName: ${vars.difySandboxFunctionName}
      sourceSubDir: code/dify-sandbox
      code:
        templated_files:
          - code/dify-sandbox/conf/config.yaml
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  difyApi:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difyApiDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 5001
      functionName: ${vars.difyApiFunctionName}
      sourceSubDir: code/dify/api
      code:
        templated_files:
          - code/dify/api/.env
      environmentVariables:
        testkey: testvalue
        DASHSCOPE_LOGGING_LEVEL: debug
        CODE_EXECUTION_ENDPOINT: "http://${resources.difySandbox.output.http_trigger_url}"
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  difyWeb:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difyWebDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 3000
      functionName: ${vars.difyWebFunctionName}
      sourceSubDir: code/dify/web
      code:
        templated_files:
          - code/dify/web/.env
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
