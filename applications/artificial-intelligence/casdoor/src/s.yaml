edition: 3.0.0
name: casdoor-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Describe: {{Description}}
  driverName: {{driverName}}
  dataSourceName: {{dataSourceName}}
  dbName: {{dbName}}
resources:
  casdoor:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Describe}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8000
      functionName: ${vars.FunctionName}
      sourceSubDir: code/casdoor
      environmentVariables:
        testkey: "testvalue"
        driverName: "${vars.driverName}"
        dataSourceName: "${vars.dataSourceName}"
        dbName: "${vars.dbName}"
        RUNNING_IN_DOCKER: "true"
        runmode: "dev"
        httpport: "8000"
        TZ: "Asia/Shanghai"
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
