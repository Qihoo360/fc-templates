# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: casdoor-v3
Provider:
- fc
Version: 0.0.3
Description: 该示例通过 Casdoor 实现多方式认证与用户管理。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/casdoor
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - FunctionName
    - driverName
    - DataBase
    - MYSQL_HOST
    - MYSQL_PORT
    - MYSQL_USERNAME
    - MYSQL_PASSWORD
    - MYSQL_DATABASE
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      - test-3
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: casdoor-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    Description:
      title: 描述
      type: string
      default: "Serverless casdoor"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
      - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    MYSQL_HOST:
      type: string
      default: ""
      description: 实例地址或者域名
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入实例地址或者域名
      x-formitem:
        type: input
    MYSQL_PORT:
      type: string
      default: "3306"
      description: 数据库实例端口号
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入实例端口号
      x-formitem:
        type: input
    MYSQL_USERNAME:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入数据库账号
      x-formitem:
        type: input
    MYSQL_PASSWORD:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入数据库密码
      x-formitem:
        type: input
    MYSQL_DATABASE:
      # title: dbName
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入数据库名
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
