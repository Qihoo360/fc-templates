Edition: 3.0.0
Type: Project
Effective: Public
Name: casdoor-v3
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 casdoor，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/casdoor
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - FunctionName
    - driverName
    - dataSourceName
    - dbName
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: casdoor-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    Description:
      title: 描述
      type: string
      default: "Serverless casdoor"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    driverName:
      title: driverName
      type: string
      default: "mysql"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-formitem:
        type: input
    dataSourceName:
      title: dataSourceName
      type: string
      default: ""
      description: "例如：root:123456@tcp(localhost:3306)/"
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库地址
      x-formitem:
        type: input
    dbName:
      title: dbName
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库名
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
