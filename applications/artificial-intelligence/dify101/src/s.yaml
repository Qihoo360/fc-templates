edition: 3.0.0
name: dify-app
access: default
vars:
  region: {{region}}
  difySandboxFunctionName: {{difySandboxFunctionName}}
  difySandboxDescribe: {{difySandboxDescription}}
  difyPluginDaemonFunctionName: {{difyPluginDaemonFunctionName}}
  difyPluginDaemonDescribe: {{difyPluginDaemonDescription}}
  difyApiFunctionName: {{difyApiFunctionName}}
  difyApiDescribe: {{difyApiDescription}}
  difyWebFunctionName: {{difyWebFunctionName}}
  difyWebDescribe: {{difyWebDescription}}
  DifyCustomDomain: {{DifyCustomDomain}}
  DifyRedisUserName: {{DifyRedisUserName}}
  DifyRedisPassword: {{DifyRedisPassword}}
  DifyRedisHost: {{DifyRedisHost}}
  DifyRedisPort: {{DifyRedisPort}}
  DifyRedisDataBase: {{DifyRedisDataBase}}
  DifyRedisDataBaseCelery: {{DifyRedisDataBaseCelery}}
  DifyDBSCHEME: {{DifyDBSCHEME}}
  DifyDBUserName: {{DifyDBUserName}}
  DifyDBPassword: {{DifyDBPassword}}
  DifyDBHost: {{DifyDBHost}}
  DifyDBPort: {{DifyDBPort}}
  DifyDBPluginDataBase: {{DifyDBPluginDataBase}}
  DifyDBDataBase: {{DifyDBDataBase}}
  DifyAwsS3Endpoint: {{DifyAwsS3Endpoint}}
  DifyAwsS3Bucket: {{DifyAwsS3Bucket}}
  DifyAwsS3Region: {{DifyAwsS3Region}}
  DifyAwsS3Ak: {{DifyAwsS3Ak}}
  DifyAwsS3Sk: {{DifyAwsS3Sk}}
  DifyWeaviateEndpoint: {{DifyWeaviateEndpoint}}
  DifyWeaviateApiKey: {{DifyWeaviateApiKey}}
  PolefsVolume: {{PolefsVolume}}
  MountDir: {{MountDir}}
  VolCreateUser: {{PolefsVolumeCreateUser}}
resources:
  difySandbox:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difySandboxDescribe}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8194
      functionName: ${vars.difySandboxFunctionName}
      sourceSubDir: code/dify-sandbox
      environmentVariables:
        testkey: testvalue
        TZ: "Asia/Shanghai"
        GIN_MODE: "debug"
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  difyPluginDaemon:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difyPluginDaemonDescribe}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 5002
      functionName: ${vars.difyPluginDaemonFunctionName}
      sourceSubDir: code/dify-plugin-daemon
      environmentVariables:
        testkey: testvalue
        TZ: "Asia/Shanghai"
        GIN_MODE: "debug"
        SERVER_PORT: "5002"
        SERVER_KEY: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
        PLATFORM: "local"
        PLUGIN_REMOTE_INSTALLING_ENABLED: "true"
        PLUGIN_REMOTE_INSTALLING_HOST: "127.0.0.1"
        PLUGIN_REMOTE_INSTALLING_PORT: "5003"
        DIFY_INNER_API_URL: "${vars.DifyCustomDomain}"
        DIFY_INNER_API_KEY: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
        REDIS_HOST: "${vars.DifyRedisHost}"
        REDIS_PORT: "${vars.DifyRedisPort}"
        REDIS_PASSWORD: "${vars.DifyRedisPassword}"
        DB_USERNAME: "${vars.DifyDBUserName}"
        DB_PASSWORD: "${vars.DifyDBPassword}"
        DB_HOST: "${vars.DifyDBHost}"
        DB_PORT: "${vars.DifyDBPort}"
        DB_DATABASE: "${vars.DifyDBPluginDataBase}"
        PLUGIN_STORAGE_TYPE: "local"
        PLUGIN_STORAGE_LOCAL_ROOT: "/app/storage"
        PLUGIN_INSTALLED_PATH: "plugin"
        PLUGIN_WORKING_PATH: "cwd"
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      dockerfilePath: "docker/local.dockerfile"
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.PolefsVolume}
          mountDir: ${vars.MountDir}
          createUserName: ${vars.VolCreateUser}
  difyApi:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difyApiDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 5001
      functionName: ${vars.difyApiFunctionName}
      sourceSubDir: code/dify/api
      environmentVariables:
        testkey: "testvalue"
        TZ: "Asia/Shanghai"
        MODE: "all"
        DASHSCOPE_LOGGING_LEVEL: "debug"
        SECRET_KEY: "IqbOnS5xUWhsiPvLn+fIU5AOBKt5QAXzuuJtfDZCoPkxjL7IMEUFNOqS"
        CONSOLE_API_URL: "${vars.DifyCustomDomain}"
        #CONSOLE_WEB_URL: ""
        SERVICE_API_URL: "${vars.DifyCustomDomain}"
        #APP_WEB_URL: ""
        #FILES_URL: ""
        CELERY_BROKER_URL: "redis://${vars.DifyRedisUserName}:${vars.DifyRedisPassword}@${vars.DifyRedisHost}:${vars.DifyRedisPort}/${vars.DifyRedisDataBaseCelery}"
        REDIS_HOST: "${vars.DifyRedisHost}"
        REDIS_PORT: "${vars.DifyRedisPort}"
        REDIS_USERNAME: "${vars.DifyRedisUserName}"
        REDIS_PASSWORD: "${vars.DifyRedisPassword}"
        REDIS_DB: "${vars.DifyRedisDataBase}"
        SQLALCHEMY_DATABASE_URI_SCHEME: "${vars.DifyDBSCHEME}"
        DB_USERNAME: "${vars.DifyDBUserName}"
        DB_PASSWORD: "${vars.DifyDBPassword}"
        DB_HOST: "${vars.DifyDBHost}"
        DB_PORT: "${vars.DifyDBPort}"
        DB_DATABASE: "${vars.DifyDBDataBase}"
        STORAGE_TYPE: "s3"
        S3_ENDPOINT: "${vars.DifyAwsS3Endpoint}"
        S3_BUCKET_NAME: "${vars.DifyAwsS3Bucket}"
        S3_ACCESS_KEY: "${vars.DifyAwsS3Ak}"
        S3_SECRET_KEY: "${vars.DifyAwsS3Sk}"
        S3_REGION: "${vars.DifyAwsS3Region}"
        VECTOR_STORE: "weaviate"
        WEAVIATE_ENDPOINT: "${vars.DifyWeaviateEndpoint}"
        WEAVIATE_API_KEY: "${vars.DifyWeaviateApiKey}"
        DEBUG: "true"
        SQLALCHEMY_ECHO: "true"
        CODE_EXECUTION_ENDPOINT: "http://${resources.difySandbox.output.http_trigger_url}"
        PLUGIN_DAEMON_URL: "http://${resources.difyPluginDaemon.output.http_trigger_url}"
        PLUGIN_DAEMON_KEY: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
        PLUGIN_REMOTE_INSTALL_HOST: "http://${resources.difyPluginDaemon.output.http_trigger_url}"
        PLUGIN_REMOTE_INSTALL_PORT: "80"
        INNER_API_KEY_FOR_PLUGIN: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"
        ENDPOINT_URL_TEMPLATE: "http://${resources.difyPluginDaemon.output.http_trigger_url}/e/{hook_id}"
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  difyWeb:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.difyWebDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 3000
      functionName: ${vars.difyWebFunctionName}
      sourceSubDir: code/dify/web
      code:
        templated_files:
          - code/dify/web/.env
      environmentVariables:
        testkey: "testvalue"
        TZ: "Asia/Shanghai"
        HOSTNAME: "0.0.0.0"
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
