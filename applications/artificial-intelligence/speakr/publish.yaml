Edition: 3.0.0
Type: Project
Name: speakr
Provider:
- fc
Version: 0.0.3
Description: 这是一个用 Speakr 基于 AI 的会议助手。
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/speakr
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: Web框架
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - functionName
  - description
  - adminEmail
  - adminUsername
  - adminPassword
  - llmBaseUrl
  - llmApiKey
  - llmModel
  - transciptionBaseUrl
  - transciptionApiKey
  - whisperModel
  - FileStorage
  - POLEFS_VOLUME
  - POLEFS_MOUNT_PATH
  - afunctionVolCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: speakr-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless speakr"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    adminEmail:
      # title: admin用户邮箱
      type: string
      default: ""
      pattern: "^.*@.*$"
      x-cate: applicationCate
      x-label: admin配置
      x-placeholder: admin用户邮箱
      x-formitem:
        type: input
    adminUsername:
      # title: admin用户名
      type: string
      default: "admin"
      pattern: ".*"
      x-cate: applicationCate
      x-label: admin配置
      x-placeholder: admin用户名
      x-formitem:
        type: input
    adminPassword:
      # title: api key
      type: secret
      default: "12345678"
      pattern: "^.{8,}$"
      description: ""
      x-cate: applicationCate
      x-label: admin配置
      x-placeholder: admin密码
      x-formitem:
        type: input
    llmBaseUrl:
      # title: api 地址
      type: string
      default: ""
      pattern: "http.*"
      description: ""
      x-cate: applicationCate
      x-label: LLM api配置
      x-placeholder: LLM BaseUrl
      x-formitem:
        type: input
    llmApiKey:
      # title: api key
      type: secret
      default: "123456"
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: LLM api配置
      x-placeholder: LLM ApiKey
      x-formitem:
        type: input
    llmModel:
      # title: 模型名称
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: LLM api配置
      x-placeholder: LLM 模型名称
      x-formitem:
        type: input
    transciptionBaseUrl:
      # title: transcription地址
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 语音识别大模型 api配置
      x-placeholder: 语音识别大模型 BaseUrl
      x-formitem:
        type: input
    transciptionApiKey:
      # title: api key
      type: secret
      default: "123456"
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 语音识别大模型 api配置
      x-placeholder: 语音识别大模型 ApiKey
      x-formitem:
        type: input
    whisperModel:
      # title: 模型名称
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 语音识别大模型 api配置
      x-placeholder: 语音识别大模型 模型名称
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    POLEFS_VOLUME:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS 卷名称
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: afunctionVolCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    POLEFS_MOUNT_PATH:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/data/instance"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    afunctionVolCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
