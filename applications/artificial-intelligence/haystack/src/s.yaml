edition: 3.0.0
name: haystack-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Describe: {{Description}}
  ElasticsearchHost: {{ElasticsearchHost}}
  ElasticsearchPort: {{ElasticsearchPort}}
resources:
  haystack:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8000
      functionName: ${vars.FunctionName}
      sourceSubDir: code/haystack
      environmentVariables:
        testkey: "testvalue"
        DOCUMENTSTORE_PARAMS_HOST: "${vars.ElasticsearchHost}"
        DOCUMENTSTORE_PARAMS_PORT: "${vars.ElasticsearchPort}"
        PIPELINE_YAML_PATH: "/opt/haystack/rest_api/rest_api/pipeline/pipelines.haystack-pipeline.yml"
        TOKENIZERS_PARALLELISM: "false"
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
