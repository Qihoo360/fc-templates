# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: sqlbot-v1
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 SQLBot 快速搭建私有代理工作空​​间。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/sql-bot
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - SqlBotFunctionName
    - PGDataBase
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USERNAME
    - POSTGRES_PASSWORD
    - POSTGRES_DATABASE
    - FileStorageExecel
    - PolefsVolumeExecel
    - MountDirExecel
    - PolefsVolumeCreateUseExecel
    - FileStorageFile
    - PolefsVolumeFile
    - MountDirFile
    - PolefsVolumeCreateUseFile
    - FileStorageImages
    - PolefsVolumeImages
    - MountDirImages
    - PolefsVolCreateUseImages
    - FileStorageLogs
    - PolefsVolumeLogs
    - MountDirLogs
    - PolefsVolumeCreateUselogs
    - FileStorageData
    - PolefsVolumeData
    - MountDirData
    - PolefsVolumeCreateUseData

  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    SqlBotFunctionName:
      title: SqlBotFunctionName 函数名
      type: string
      default: refly-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入reflyApi 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    SqlBotDescription:
      title: reflyApi函数描述
      type: string
      default: "Serverless refly api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入reflyApi函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
  
    PGDataBase:
      type: string
      default: postgresql
      description: ""
      enum:
        - postgresql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    POSTGRES_HOST:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库主机地址
      x-formitem:
        type: input
    POSTGRES_PORT:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库端口
      x-formitem:
        type: input
    POSTGRES_USERNAME:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库用户名
      x-formitem:
        type: input
    POSTGRES_PASSWORD:
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 输入数据库密码
      x-formitem:
        type: input
    POSTGRES_DATABASE:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 输入数据库名称
      x-formitem:
        type: input
    FileStorageExecel:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    PolefsVolumeExecel:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    MountDirExecel:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/opt/sqlbot/data/excel"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    PolefsVolumeCreateUserExecel:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
    FileStorageFile:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    PolefsVolumeFile:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    MountDirFile:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/opt/sqlbot/data/file"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    PolefsVolumeCreateUseFile:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
    FileStorageImages:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    PolefsVolumeImages:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS卷
      x-api-uri: /resources/polefs/volumes
