edition: 3.0.0
name: yprompt-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}
  DOMAIN: {{DOMAIN}}
  ADMIN_USERNAME: {{ADMIN_USERNAME}}
  ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
  SECRET_KEY: {{SECRET_KEY}}
  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /app/data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  yprompt:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      sourceSubDir: YPrompt
      cloudBuildType: Dockerfile
      port: 80
      functionName: ${vars.FunctionName}
      environmentVariables:
        TZ: "Asia/Shanghai"
        YPROMPT_PORT: 8888
        YPROMPT_HOST: 0.0.0.0
        WORKERS: 4
        DEBUG: false
        ACCESS_LOG: true

        DOMAIN: ${vars.DOMAIN}
        SECRET_KEY: ${vars.SECRET_KEY}
        ADMIN_USERNAME: ${vars.ADMIN_USERNAME}
        ADMIN_PASSWORD: ${vars.ADMIN_PASSWORD}
        DB_TYPE: sqlite
        SQLITE_DB_PATH: ${vars.VOLUME_MOUNT_PATH}/yprompt.db 

      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}