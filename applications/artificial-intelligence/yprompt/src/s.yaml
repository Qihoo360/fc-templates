edition: 3.0.0
name: yprompt-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}
  DOMAIN: {{DOMAIN}}
  ADMIN_USERNAME: {{ADMIN_USERNAME}}
  ADMIN_PASSWORD: {{ADMIN_PASSWORD}}
  SECRET_KEY: {{SECRET_KEY}}
  DATABASE_TYPE: {{DATABASE_TYPE}}
  MYSQL_HOST: {{MYSQL_HOST}}
  MYSQL_PORT: {{MYSQL_PORT}}
  MYSQL_USERNAME: {{MYSQL_USERNAME}}
  MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
  MYSQL_DATABASE: {{MYSQL_DATABASE}}
resources:
  yprompt:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      sourceSubDir: YPrompt
      cloudBuildType: Dockerfile
      port: 80
      functionName: ${vars.FunctionName}
      environmentVariables:
        TZ: "Asia/Shanghai"
        YPROMPT_PORT: 8888
        YPROMPT_HOST: 0.0.0.0
        WORKERS: 4
        DEBUG: false
        ACCESS_LOG: true

        DOMAIN: ${vars.DOMAIN}
        SECRET_KEY: ${vars.SECRET_KEY}
        ADMIN_USERNAME: ${vars.ADMIN_USERNAME}
        ADMIN_PASSWORD: ${vars.ADMIN_PASSWORD}
        DB_TYPE: ${vars.DATABASE_TYPE}
        DB_HOST: ${vars.MYSQL_HOST}
        DB_PORT: ${vars.MYSQL_PORT}
        DB_USER: ${vars.MYSQL_USERNAME}
        DB_PASS: ${vars.MYSQL_PASSWORD}
        DB_NAME: ${vars.MYSQL_DATABASE}
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
