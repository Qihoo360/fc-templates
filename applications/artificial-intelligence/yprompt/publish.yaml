    #   x-formitem:
    #     type: input
    # MYSQL_USERNAME:
    #   type: string
    #   default: "yprompt_admin"
    #   pattern: ".{0,255}$"
    #   description: 数据库账号
    #   x-cate: applicationCate
    #   x-label: 数据库配置
    #   x-restype: mysql
    #   x-placeholder: 请输入数据库账号
    #   x-formitem:
    #     type: input
    # MYSQL_PASSWORD:
    #   type: secret
    #   default: "yprompt_admin_${default-suffix}"
    #   pattern: ".{0,255}$"
    #   description: 数据库密码
    #   x-cate: applicationCate
    #   x-label: 数据库配置
    #   x-restype: postgresql
    #   x-placeholder: 请输入数据库密码
