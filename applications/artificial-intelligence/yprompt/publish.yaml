    FileStorage:
      type: string
      default: Polefs
      description: 文件存储类型
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-formitem:
        type: select
    POLEFS_VOLUME:
      title: 卷名称
      type: string
      description: |
        保存应用数据的文件存储，如：'bjpdc-polefs/app/data'；注：复用存储时需要注意数据覆盖的问题
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: POLEFS 存储卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: POLEFS_VOLUME_CREATE_USER
      x-formitem:
        type: input
        name: volume_unique_name
    POLEFS_VOLUME_CREATE_USER:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true

PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: ""
