edition: 3.0.0
name: qanything-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Describe: {{Description}}
  OpenaiApiBase: {{OpenaiApiBase}}
  OpenaiApiKey: {{OpenaiApiKey}}
  OpenaiApiModel: {{OpenaiApiModel}}
resources:
  qanything:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8777
      functionName: ${vars.FunctionName}
      sourceSubDir: code/qanything
      environmentVariables:
        testkey: "testvalue"
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: "bash scripts/base_run.sh -s LinuxOrWSL -w 4 -m 19530 -q 8777 -c -o -b ${vars.OpenaiApiBase} -k ${vars.OpenaiApiBase} -n {vars.OpenaiApiModel} -l '4096'"
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
