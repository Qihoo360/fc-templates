# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: qanything-v3
Provider:
- fc
Version: 0.0.3
Description: 该示例通过 QAnything 实现本地文档问答系统。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/qanything
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - FunctionName
  - OPENAI_URL
  - OPENAI_API_KEY
  - OPENAI_MODELNAME
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: qanything-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    Description:
      title: 描述
      type: string
      default: "Serverless qanything"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    OPENAI_URL:
      # title: OPENAI_URL
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: OpenApi配置
      x-restype: openai
      x-placeholder: OPENAI_URL
      x-formitem:
        type: input
    OPENAI_API_KEY:
      # title: OPENAI_API_KEY
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: OpenApi配置
      x-restype: openai
      x-placeholder: OPENAI_API_KEY
      x-formitem:
        type: input
    OPENAI_MODELNAME:
      # title: OPENAI_MODELNAME
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: OpenApi配置
      x-restype: openai
      x-placeholder: OPENAI_MODELNAME
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
