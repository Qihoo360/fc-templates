Edition: 3.0.0
Type: Project
Name: n8n
Provider:
- fc
Version: 0.0.3
Description: 这是一个创建 n8n 工作流自动化平台的示例,n8n 让您能够构建强大的自动化流程，同时完全控制您的数据和部署。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/n8n
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 人工智能
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - functionName
  - polefsVolume
  - mountDir
  - polefsVolumeCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: cn-north-cu-1
      description: 创建应用所在的地区
      x-cate: resourceCate
      enum:
        - cn-north-cu-1
      x-reaction-properties:
      - polefsVolume
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: n8n-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    description:
      title: 函数描述
      type: string
      default: "Serverless n8n"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
