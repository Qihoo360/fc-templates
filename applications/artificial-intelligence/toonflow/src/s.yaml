edition: 3.0.0
name: toonflow
access: default
vars:
  Region: {{region}}
  FunctionName: {{FunctionName}}
  Description: {{Description}}
  AUTH_USERNAME: "{{TOONFLOW_AUTH_USERNAME}}"
  AUTH_PASSWORD: "{{TOONFLOW_AUTH_PASSWORD}}"
  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /data
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  toonflow:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.Region}
      description: ${vars.Description}
      runtime: custom
      memorySize: 4096
      cpu: 2
      requestCpu: 0.5
      requestMemory: 1024
      diskSize: 512
      timeout: 72000
      instanceConcurrency: 1
      requestType: http
      runtimeType: customize
      sourceSubDir: code/toonflow
      cloudBuildType: Dockerfile
      port: 3000
      functionName: ${vars.FunctionName}
      environmentVariables:
        NODE_ENV: production
        TOONFLOW_SERVER_PORT: "3000"
        TOONFLOW_DATA_DIR: /data/toonflow
        TOONFLOW_AUTH_REQUIRED: "true"
        TOONFLOW_AUTH_USERNAME: ${vars.AUTH_USERNAME}
        TOONFLOW_AUTH_PASSWORD: ${vars.AUTH_PASSWORD}
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      networkType: vpc
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
