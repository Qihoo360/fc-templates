# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: mem0-v1
Provider:
- fc
Version: 0.0.1
Description: 该示例通过 mem0 快速搭建现代AI代理设计的内存层。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/mem0
Tags:
- AI
- Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - mem0FunctionName
  - Mem0RedisDataBase
  - REDIS_PASSWORD
  - REDIS_HOST
  - REDIS_PORT
  - Mem0Neo4jDataBase
  - Mem0Neo4jHost
  - Mem0Neo4jPort
  - Mem0Neo4jUser
  - Mem0Neo4jDbPassword
  - Mem0Neo4jDbname
  - OPENAI_URL
  - OPENAI_API_KEY
  - OPENAI_MODELNAME
  - OpenaiEmbeddingModel
  - OpenaiMaxTokens
  - OpenaiTemperature
  - OpenaiEmbeddingDims
  - FileStorage
  - POLEFS_VOLUME
  - POLEFS_MOUNT_PATH
  - PolefsVolumeCreateUse
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    mem0FunctionName:
      title: mem0 函数名
      type: string
      default: mem0-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: mem0 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    mem0Description:
      title: mem0 函数描述
      type: string
      default: "Serverless mem0"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入mem0函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    Mem0RedisDataBase:
      # title: 缓存配置
      type: string
      default: redis
      description: ""
      enum:
      - redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    REDIS_HOST:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入redis主机地址
      x-formitem:
        type: input
    REDIS_PORT:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入redis主机端口
      x-formitem:
        type: input
    REDIS_PASSWORD:
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入redis密码
      x-formitem:
        type: input
    Mem0Neo4jDataBase:
      type: string
      default: neo4j
      description: ""
      enum:
      - neo4j
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    Mem0Neo4jHost:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请输入数据库主机地址
      x-formitem:
        type: input
    Mem0Neo4jPort:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请输入数据库端口
      x-formitem:
        type: input
    Mem0Neo4jUser:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请输入数据库用户名
      x-formitem:
        type: input
    Mem0Neo4jDbPassword:
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请输入数据库密码
      x-formitem:
        type: input
    Mem0Neo4jDbname:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 图数据库配置
      x-restype: neo4j
      x-placeholder: 请输入数据库名称
      x-formitem:
        type: input
    OPENAI_URL:
      # title: OpenaiApiBaseUrl
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiApiBaseUrl
      x-formitem:
        type: input
    OPENAI_API_KEY:
      # title: OpenaiApiKey
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiApiKey
      x-formitem:
        type: input
    OPENAI_MODELNAME:
      # title: OpenaiModel
      type: string
      default: "360-deepseek-v3"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiModel
      x-formitem:
        type: input
    OpenaiEmbeddingModel:
      # title: OpenaiEmbeddingModel
      type: string
      default: "text-embedding-3-small"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiEmbeddingModel
      x-formitem:
        type: input
    OpenaiMaxTokens:
      # title: OpenaiMaxTokens
      type: string
      default: "2000"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiMaxTokens
      x-formitem:
        type: input
    OpenaiTemperature:
      # title: OpenaiTemperature
      type: string
      default: "0.2"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiTemperature
      x-formitem:
        type: input
    OpenaiEmbeddingDims:
      # title: OpenaiEmbeddingDims
      type: string
      default: "1536"
      description: ""
      x-cate: applicationCate
      x-label: Openai
      x-restype: llm-apikey
      x-placeholder: 请输入OpenaiEmbeddingDims
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    POLEFS_VOLUME:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS卷
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    POLEFS_MOUNT_PATH:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/app/history"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    PolefsVolumeCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
