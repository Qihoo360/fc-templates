# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: mem0-v1
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 rudderstack 快速搭建私有代理工作空​​间。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/rudderstack
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - BackendFunctionName
    - MetricsExporterFunctionName
    - DTransformerFunctionName

    - PGDataBase
    - POSTGRES_HOST
    - POSTGRES_PORT
    - POSTGRES_USERNAME
    - POSTGRES_PASSWORD
    - POSTGRES_DATABASE

    - WORKSPACE_TOKEN

  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    BackendFunctionName:
      title: BackendFunctionName 函数名
      type: string
      default: backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入 backend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    BackendDescription:
      title: backend函数描述
      type: string
      default: "Serverless backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入backend函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    MetricsExporterFunctionName:
      title: MetricsExporterFunctionName 函数名
      type: string
      default: metrics-exporter-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入 metrics-exporter 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    MetricsExporterDescription:
      title: metrics-exporter函数描述
      type: string
      default: "Serverless metrics-exporter"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入metrics-exporter函数描述
      x-cate: resourceCate
      x-formitem:
        type: input  
    DTransformerFunctionName:
      title: DTransformerFunctionName 函数名
      type: string
      default: d-transformer-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder:  请输入 d-transformer 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    DTransformerDescription:
      title: d-transformer函数描述
      type: string
      default: "Serverless d-transformer"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入d-transformer函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    PGDataBase:
      type: string
      default: postgresql
      description: ""
      enum:
        - postgresql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    POSTGRES_HOST:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库主机地址
      x-formitem:
        type: input
    POSTGRES_PORT:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库端口
      x-formitem:
        type: input
    POSTGRES_USERNAME:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库用户名
      x-formitem:
        type: input
    POSTGRES_PASSWORD:
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 输入数据库密码
      x-formitem:
        type: input
    POSTGRES_DATABASE:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 输入数据库名称
      x-formitem:
        type: input
    WORKSPACE_TOKEN:
      type: string
      default: ""
      description: "工作空间访问 Token"
      x-cate: applicationCate
      x-label: 工作空间 Token
      x-placeholder: 请输入工作空间 Token
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  # workspaceToken:
  #   title: "访问令牌"
  #   description: "工作空间访问 Token"
    
