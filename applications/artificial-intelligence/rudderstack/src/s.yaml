  #           disable_url_internet: true
  #           auth_config: ""
  DTransformer:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.DTransformerDescription}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 10240
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 9099
      functionName: ${vars.DTransformerFunctionName}
      sourceSubDir: code/d-transformer
      environmentVariables:
        testkey: "testvalue"
        TZ: "Asia/Shanghai"
        PORT: 9099
        STATSD_SERVER_PORT: ${vars.MetricsExporterPORT}
        STATSD_SERVER_HOST: ${vars.MetricsExporterHOST}
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      dockerfilePath: "Dockerfile"
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
  Backend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.BackendDescription}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 10240
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 8080
      functionName: ${vars.BackendFunctionName}
      sourceSubDir: code/rudder-server
      environmentVariables:
        testkey: "testvalue"
        TZ: "Asia/Shanghai"
        JOBS_DB_HOST: ${vars.PGHost}
        JOBS_DB_PORT: ${vars.PGPort}
        JOBS_DB_USER: ${vars.PGUser}
        JOBS_DB_PASSWORD: ${vars.PGPassword}
        JOBS_DB_DB_NAME: ${vars.PGDbName}
        JOBS_DB_SSL_MODE: disable
        POSTGRES_PASSWORD: ${vars.PGPassword}
        POSTGRES_USER: ${vars.PGUser}
        POSTGRES_DB: ${vars.PGDbName}
        DEST_TRANSFORM_URL: http://${resources.DTransformer.output.http_trigger_url}
        CONFIG_BACKEND_URL: https://api.rudderstack.com
        WORKSPACE_TOKEN: ${vars.WORKSPACE_TOKEN}
        STATSD_SERVER_URL: ${vars.MetricsExporterHOST}:${vars.MetricsExporterPORT}
        RSERVER_GATEWAY_WEBHOOK_SOURCE_LIST_FOR_PARSING_PARAMS: Shopify
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      dockerfilePath: "Dockerfile"
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""