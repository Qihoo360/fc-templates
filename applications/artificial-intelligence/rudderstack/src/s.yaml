edition: 3.0.0
name: rudderstack-app
access: default
vars:
  region: {{region}}
  BackendFunctionName : {{BackendFunctionName}}
  BackendDescription : {{BackendDescription}}
  # MetricsExporterFunctionName : {{MetricsExporterFunctionName}}
  # MetricsExporterDescription : {{MetricsExporterDescription}}
  DTransformerFunctionName : {{DTransformerFunctionName}}
  DTransformerDescription : {{DTransformerDescription}} 
  PGDataBase: {{PGDataBase}}
  PGHost: {{POSTGRES_HOST}}
  PGPort: {{POSTGRES_PORT}}
  PGUser: {{POSTGRES_USERNAME}}
  PGPassword: {{POSTGRES_PASSWORD}}
  PGDbName: {{POSTGRES_DATABASE}}
  MetricsExporterHOST: {{MetricsExporterHOST}}
  MetricsExporterPORT: {{MetricsExporterPORT}}
  WORKSPACE_TOKEN: {{WORKSPACE_TOKEN}}
resources:
