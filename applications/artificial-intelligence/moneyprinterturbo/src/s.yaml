edition: 3.0.0
name: moneyprinterturbo-app
access: default
vars:
  region: {{region}}
  moneyprinterturboApiFunctionName: {{moneyprinterturboApiFunctionName}}
  moneyprinterturboApiDescribe: {{moneyprinterturboApiDescription}}
  moneyprinterturboWebFunctionName: {{moneyprinterturboWebFunctionName}}
  moneyprinterturboWebDescribe: {{moneyprinterturboWebDescription}}
  PolefsVolume: {{PolefsVolume}}
  MountDir: {{MountDir}}
  VolCreateUser: {{PolefsVolumeCreateUser}}
resources:
  moneyprinterturboApi:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.moneyprinterturboApiDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 599
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      dockerfilePath: Dockerfile-api 
      port: 8080
      functionName: ${vars.moneyprinterturboApiFunctionName}
      sourceSubDir: code/moneyprinterturbo
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.PolefsVolume}
          mountDir: ${vars.MountDir}
          createUserName: ${vars.VolCreateUser}
  moneyprinterturboWeb:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.moneyprinterturboWebDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 599
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      dockerfilePath: Dockerfile 
      port: 8501
      functionName: ${vars.moneyprinterturboWebFunctionName}
      sourceSubDir: code/moneyprinterturbo
      code:
        templated_files:
          - code/moneyprinterturbo/app/config/config.py
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.PolefsVolume}
          mountDir: ${vars.MountDir}
          createUserName: ${vars.VolCreateUser}
