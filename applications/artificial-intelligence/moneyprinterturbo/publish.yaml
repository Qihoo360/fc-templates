Edition: 3.0.0
Type: Project
Effective: Public
Name: moneyprinterturbo-v3
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 moneyprinterturbo，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/moneyprinterturbo
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - moneyprinterturboApiFunctionName
    - moneyprinterturboWebFunctionName
    - PolefsVolume
    - MountDir
    - PolefsVolumeCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    moneyprinterturboApiFunctionName:
      title: Api函数名
      type: string
      default: moneyprinterturbo-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    moneyprinterturboApiDescription:
      title: Api描述
      type: string
      default: "Serverless moneyprinterturbo api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    moneyprinterturboWebFunctionName:
      title: Web函数名
      type: string
      default: moneyprinterturbo-web-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-formitem:
        type: input
    moneyprinterturboWebDescription:
      title: Web描述
      type: string
      default: "Serverless moneyprinterturbo web"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    PolefsVolume:
      title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: PoleFS 卷名称
      x-cate: applicationCate
      x-label: nasLabel
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    MountDir:
      title: 函数挂载路径
      type: string
      description: 函数挂载路径
      default: "/mnt"
      x-cate: applicationCate
      x-label: nasLabel
      x-formitem:
        type: input
      x-hidden: true
    PolefsVolumeCreateUser:
      title: 函数挂载的创建用户
      type: string
      default: ""
      description: 卷的创建用户
      x-cate: applicationCate
      x-label: nasLabel
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
