Edition: 3.0.0
Type: Project
Effective: Public
Name: moneyprinterturbo-v3
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 MoneyPrinterTurbo 自动生成短视频内容。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/moneyprinterturbo
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - moneyprinterturboApiFunctionName
    - moneyprinterturboWebFunctionName
    - FileStorage
    - POLEFS_VOLUME
    - POLEFS_MOUNT_PATH
    - PolefsVolumeCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    moneyprinterturboApiFunctionName:
      title: Api函数名
      type: string
      default: moneyprinterturbo-api-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入Api函数名
      x-formitem:
        type: input
    moneyprinterturboApiDescription:
      title: Api描述
      type: string
      default: "Serverless moneyprinterturbo api"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入Api函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    moneyprinterturboWebFunctionName:
      title: Web函数名
      type: string
      default: moneyprinterturbo-web-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入Web函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    moneyprinterturboWebDescription:
      title: Web描述
      type: string
      default: "Serverless moneyprinterturbo web"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入Web函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
        - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    POLEFS_VOLUME:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS 卷名称
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: PolefsVolumeCreateUser
      x-formitem:
        type: input
        name: volume_unique_name
    POLEFS_MOUNT_PATH:
      # title: 函数挂载路径
      type: string
      description: ""
      default: "/mnt/conf"
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载路径
      x-formitem:
        type: input
    PolefsVolumeCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
