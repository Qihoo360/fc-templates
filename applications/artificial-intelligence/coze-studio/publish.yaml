# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: coze-loop
Provider:
- fc
Version: 0.0.1
Description: 这是一个一站式 AI Agent 开发工具
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/coze-studio
Tags:
- AI
- Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - cozestudioBackendFunctionName
  - cozestudioBackendDescription
  - cozestudioFrontendFunctionName
  - cozestudioFrontendDescription
  - useSSL
  - pluginAesAuthSecret
  - pluginAesStateSecret
  - pluginAesOauthTokenSecret
  - ObjectStorage
  - minioEndpoint
  - minioAccessKey
  - minioSecretKey
  - minioApiHost
  - miniodefaultBucket
  - storageUploadHttpSchema
  - CacheDB
  - redisAddr
  - redisPasswd
  - DataBase
  - mysqlHost
  - mysqlPort
  - mysqlDatabase
  - mysqlUser
  - mysqlPasswd
  - MQ
  - mqNamesvrAddr
  - VectorDB
  - milvusAddress
  - milvusUser
  - milvusPasswd
  - elasticsearchUrl
  - elasticsearchVersion
  - embeddingType
  - arkEmbeddingDims
  - embeddingMaxBatchSize
  - FileStorage
  - functionPolefsVolumn
  - afunctionVolCreateUser
  properties:
    region:
      title: 地域
      type: string
      default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
      - cn-north-cu-1
      x-cate: resourceCate
      x-reaction-properties:
      - functionPolefsVolumn
      x-formitem:
        type: select
    cozestudioBackendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio backend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioBackendDescription:
      title: 描述
      type: string
      default: "cozestudio backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio backend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-frontend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio frontend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendDescription:
      title: 描述
      type: string
      default: "cozestudio frontend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio frontend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    useSSL:
      type: string
      default: "0"
      description: "coze studio server use ssl or not"
      x-label: Server配置
      x-cate: applicationCate
      x-placeholder: 请输入 coze studio server 是否启用 SSL
      x-formitem:
        type: input
    pluginAesAuthSecret:
      type: secret
      default: "^*6x3hdu2nc%-p38"
      description: "secret used to encrypt plugin authorization payload"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesStateSecret:
      type: secret
      default: "osj^kfhsd*(z!sno"
      description: "secret used to encrypt oauth state"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesOauthTokenSecret:
      type: secret
      default: "cn+vPJ(HhJ[5d*z9"
      description: "secret used to encrypt oauth refresh token and access token"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    ObjectStorage:
      # title: 对象存储配置
      type: string
      default: minio
      description: ""
      enum:
      - minio
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请选择对象存储类型
      x-formitem:
        type: select
    minioEndpoint:
      type: string
      default: "minio-beijing.functions:9000"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 minio Endpoint
      x-formitem:
        type: input
    minioAccessKey:
      type: secret
      default: "minioadmin"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 minio AccessKey
      x-formitem:
        type: input
    minioSecretKey:
      type: secret
      default: "minioadmin"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 minio SecretKey
      x-formitem:
        type: input
    minioApiHost:
      type: string
      default: "http://minio-beijing.functions:9000"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 minio Bucket
      x-formitem:
        type: input
    miniodefaultBucket:
      type: string
      default: "milvus"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 minio Region
      x-formitem:
        type: input
    storageUploadHttpSchema:
      # title: milvus token
      type: string
      default: "http"
      description: "If coze studio website is https, you must set it to https"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入对象存储 http schema
      x-formitem:
        type: input
    CacheDB:
      # title: 缓存配置
      type: string
      default: Redis
      description: ""
      enum:
      - Redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    redisAddr:
      # title: DifyRedisUserName
      type: string
      default: "host:port"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入 redis host:port
      x-formitem:
        type: input
    redisPasswd:
      # title: DifyRedisUserName
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入 redis password
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
      - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    mysqlHost:
      # title: 数据库名 Host
      type: string
      default: 127.0.0.1
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql host
      x-formitem:
        type: input
    mysqlPort:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql port
      x-formitem:
        type: input
    mysqlDatabase:
      # title: 数据库名 Host
      type: string
      default: "opencoze"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql database
      x-formitem:
        type: input
    mysqlUser:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql user
      x-formitem:
        type: input
    mysqlPasswd:
      # title: 数据库名 Host
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql password
      x-formitem:
        type: input
    MQ:
      # title: 数据库配置
      type: string
      default: nsq
      description: ""
      enum:
      - nsq
      - rmq
      - kafka
      x-cate: applicationCate
      x-label: MQ配置
      x-placeholder: 请选择MQ类型
      x-formitem:
        type: select
    mqNamesvrAddr:
      type: string
      default: "coze-nsqd-i8s.functions:4150"
      description: ""
      x-cate: applicationCate
      x-label: MQ配置
      x-placeholder: 请输入 mq nameserver address
      x-formitem:
        type: input
    VectorDB:
      # title: 向量数据库配置
      type: string
      default: milvus
      description: ""
      enum:
      - milvus
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: 请选择向量数据库类型
      x-formitem:
        type: select
    milvusAddress:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus host:port
      x-formitem:
        type: input
    milvusUser:
      # title: milvus token
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus user
      x-formitem:
        type: input
    milvusPasswd:
      # title: milvus token
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus password
      x-formitem:
        type: input
    elasticsearchUrl:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入Elasticsearch url
      x-formitem:
        type: input
    elasticsearchVersion:
      type: string
      default: "v8"
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入 Elasticsearch version
      x-formitem:
        type: input
    embeddingType:
      # title: 缓存配置
      type: string
      default: ark
      description: ""
      enum:
      - ark
      - openai
      - ollama
      - http
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: llm-apikey
      x-placeholder: 请选择 embedding 类型
      x-formitem:
        type: select
    arkEmbeddingDims:
      # title: DifyRedisUserName
      type: string
      default: "1024"
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: llm-apikey
      x-placeholder: 请输入 ark embedding dimensions
      x-formitem:
        type: input
    embeddingMaxBatchSize:
      # title: DifyRedisUserName
      type: string
      default: "100"
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: llm-apikey
      x-placeholder: 请输入 embedding max batch size
      x-formitem:
        type: input
    FileStorage:
      # title: 文件存储配置
      type: string
      default: Polefs
      description: ""
      enum:
      - Polefs
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 请选择文件存储类型
      x-formitem:
        type: select
    functionPolefsVolumn:
      # title: 函数挂载 PoleFS 卷名称
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载 PoleFS 卷名称
      x-api-uri: /resources/polefs/volumes
      x-extends-value:
        create_username: afunctionVolCreateUser
      x-formitem:
        type: select
        name: volume_unique_name
    afunctionVolCreateUser:
      # title: 函数挂载的创建用户
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 文件存储配置
      x-restype: polefs
      x-placeholder: 函数挂载的创建用户
      x-hidden: true
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
