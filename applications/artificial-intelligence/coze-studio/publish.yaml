# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: coze-loop
Provider:
- fc
Version: 0.0.1
Description: 这是一个一站式 AI Agent 开发工具
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/coze-studio
Tags:
- AI
- Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - cozestudioBackendFunctionName
  - cozestudioBackendDescription
  - cozestudioFrontendFunctionName
  - cozestudioFrontendDescription
  - pluginAesAuthSecret
  - pluginAesStateSecret
  - pluginAesOauthTokenSecret
  - ObjectStorage
  - s3Endpoint
  - s3AccessKey
  - s3SecretKey
  - s3Region
  - s3Bucket
  - CacheDB
  - redisAddr
  - redisPasswd
  - DataBase
  - mysqlHost
  - mysqlPort
  - mysqlDatabase
  - mysqlUser
  - mysqlPasswd
  - MQ
  - mqNamesvrAddr
  - VectorDB
  - milvusAddress
  - milvusUser
  - milvusPasswd
  - elasticsearchUrl
  - elasticsearchVersion
  - embeddingType
  - embeddingMaxBatchSize
  - openaiEmbeddingBaseUrl
  - openaiEmbeddingModel
  - openaiEmbeddingApiKey
  - openaiEmbeddingDims
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-reaction-properties:
      - functionPolefsVolumn
      x-formitem:
        type: select
    cozestudioBackendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio backend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioBackendDescription:
      title: 描述
      type: string
      default: "cozestudio backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio backend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-frontend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio frontend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendDescription:
      title: 描述
      type: string
      default: "cozestudio frontend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio frontend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    logLevel:
      type: string
      default: "debug"
      description: "log level"
      x-label: Server配置
      x-cate: applicationCate
      x-placeholder: 请输入 log level
      x-formitem:
        type: input
    pluginAesAuthSecret:
      type: secret
      default: "^*6x3hdu2nc%-p38"
      description: "secret used to encrypt plugin authorization payload"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesStateSecret:
      type: secret
      default: "osj^kfhsd*(z!sno"
      description: "secret used to encrypt oauth state"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesOauthTokenSecret:
      type: secret
      default: "cn+vPJ(HhJ[5d*z9"
      description: "secret used to encrypt oauth refresh token and access token"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    ObjectStorage:
      # title: 对象存储配置
      type: string
      default: s3
      description: ""
      enum:
      - s3
      - minio
      - tos
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请选择对象存储类型
      x-formitem:
        type: select
    # minioEndpoint:
    #   type: string
    #   default: "minio-beijing.functions:9000"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: 对象存储配置
    #   x-restype: minio
    #   x-placeholder: 请输入 minio Endpoint
    #   x-formitem:
    #     type: input
    # minioAccessKey:
    #   type: secret
    #   default: "minioadmin"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: 对象存储配置
    #   x-restype: minio
    #   x-placeholder: 请输入 minio AccessKey
    #   x-formitem:
    #     type: input
    # minioSecretKey:
    #   type: secret
    #   default: "minioadmin"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: 对象存储配置
    #   x-restype: minio
    #   x-placeholder: 请输入 minio SecretKey
    #   x-formitem:
    #     type: input
    # minioApiHost:
    #   type: string
    #   default: "http://minio-beijing.functions:9000"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: 对象存储配置
    #   x-restype: minio
    #   x-placeholder: 请输入 minio Bucket
    #   x-formitem:
    #     type: input
    # miniodefaultBucket:
    #   type: string
    #   default: "milvus"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: 对象存储配置
    #   x-restype: minio
    #   x-placeholder: 请输入 minio Region
    #   x-formitem:
    #     type: input
    s3AccessKey:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 Accesskey
      x-formitem:
        type: input
    s3SecretKey:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3SecretKey
      x-formitem:
        type: input
    s3Endpoint:
      type: string
      default: ""
      description: ""
      pattern: "https?.*$"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 endpoint
      x-formitem:
        type: input
    s3Region:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 region
      x-formitem:
        type: input
    s3Bucket:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 bucketEndpoint
      x-formitem:
        type: input
    CacheDB:
      # title: 缓存配置
      type: string
      default: redis
      description: ""
      enum:
      - redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请选择缓存系统
      x-formitem:
        type: select
    redisAddr:
      # title: DifyRedisUserName
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入 redis host:port
      x-formitem:
        type: input
    redisPasswd:
      # title: DifyRedisUserName
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入 redis password
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
      - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    mysqlHost:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql host
      x-formitem:
        type: input
    mysqlPort:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql port
      x-formitem:
        type: input
    mysqlDatabase:
      # title: 数据库名 Host
      type: string
      default: "opencoze"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql database
      x-formitem:
        type: input
    mysqlUser:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql user
      x-formitem:
        type: input
    mysqlPasswd:
      # title: 数据库名 Host
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql password
      x-formitem:
        type: input
    MQ:
      type: string
      default: kafka
      description: ""
      enum:
      - kafka
      - nsq
      x-cate: applicationCate
      x-label: MQ配置
      x-placeholder: 请选择MQ类型
      x-formitem:
        type: select
    mqNamesvrAddr:
      type: string
      default: ""
      description: "需包含topic: opencoze_knowledge, opencoze_search_app, opencoze_search_resource"
      x-cate: applicationCate
      x-label: MQ配置
      x-restype: kafka
      x-placeholder: kafka host:port
      x-formitem:
        type: input
    # rmqAccessKey:
