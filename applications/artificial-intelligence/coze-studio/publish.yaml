    #   x-placeholder: "请输入 rmq secret key"
    #   x-formitem:
    #     type: input
    VectorDB:
      # title: 向量数据库配置
      type: string
      default: milvus
      description: ""
      enum:
      - milvus
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: 请选择向量数据库类型
      x-formitem:
        type: select
    milvusAddress:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus host:port
      x-formitem:
        type: input
    milvusUser:
      # title: milvus token
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus user
      x-formitem:
        type: input
    milvusPasswd:
      # title: milvus token
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus password
      x-formitem:
        type: input
