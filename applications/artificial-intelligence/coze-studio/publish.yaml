# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: coze-loop
Provider:
- fc
Version: 0.0.1
Description: 这是一个一站式 AI Agent 开发工具
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/artificial-intelligence/coze-studio
Tags:
- AI
- Custom Runtime
Category: 人工智能
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - cozestudioBackendFunctionName
  - cozestudioBackendDescription
  - cozestudioFrontendFunctionName
  - cozestudioFrontendDescription
  - pluginAesAuthSecret
  - pluginAesStateSecret
  - pluginAesOauthTokenSecret

  - ObjectStorage
  - S3_ENDPOINT
  - S3_AK
  - S3_SK
  - S3_REGION
  - S3_BUCKET

  - CacheDB
  - REDIS_HOST
  - REDIS_PORT
  - REDIS_PASSWORD

  - DataBase
  - MYSQL_HOST
  - MYSQL_PORT
  - MYSQL_DATABASE
  - MYSQL_USERNAME
  - MYSQL_PASSWORD

  - KAFKA_BROKERS
  - VectorDB
  - MILVUS_HOST
  - MILVUS_PORT
  - MILVUS_USERNAME
  - MILVUS_PASSWORD
  - ELASTICSEARCH_HOST
  - ELASTICSEARCH_PORT
  - ELASTICSEARCH_USERNAME
  - ELASTICSEARCH_PASSWORD
  - ELASTICSEARCH_VERSION
  - embeddingType
  - embeddingMaxBatchSize
  - OPENAI_URL
  - OPENAI_MODELNAME
  - OPENAI_API_KEY
  - openaiEmbeddingDims
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      - test-3
      - cn-north-cu-1
      x-cate: resourceCate
      x-reaction-properties:
      - functionPolefsVolumn
      x-formitem:
        type: select
    cozestudioBackendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-backend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio backend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioBackendDescription:
      title: 描述
      type: string
      default: "cozestudio backend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio backend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendFunctionName:
      title: 函数名
      type: string
      default: cozestudio-frontend-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 cozestudio frontend 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    cozestudioFrontendDescription:
      title: 描述
      type: string
      default: "cozestudio frontend"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 cozestudio frontend 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    logLevel:
      type: string
      default: "debug"
      description: "log level"
      x-label: Server配置
      x-cate: applicationCate
      x-placeholder: 请输入 log level
      x-formitem:
        type: input
    pluginAesAuthSecret:
      type: secret
      default: "^*6x3hdu2nc%-p38"
      description: "secret used to encrypt plugin authorization payload"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesStateSecret:
      type: secret
      default: "osj^kfhsd*(z!sno"
      description: "secret used to encrypt oauth state"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    pluginAesOauthTokenSecret:
      type: secret
      default: "cn+vPJ(HhJ[5d*z9"
      description: "secret used to encrypt oauth refresh token and access token"
      x-label: Plugin AES secret
      x-cate: applicationCate
      pattern: ".{0,16}$|.{0,24}$|.{0,32}$"
      x-placeholder: must be 16, 24 or 32 bytes
      x-formitem:
        type: input
    ObjectStorage:
      type: string
      default: OBS
      description: 请选择对象存储
      enum:
      - OBS
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-formitem:
        type: select
    S3_AK:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 Accesskey
      x-formitem:
        type: input
    S3_SK:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3SecretKey
      x-formitem:
        type: input
    S3_ENDPOINT:
      type: string
      default: ""
      description: ""
      pattern: "https?.*$"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 endpoint
      x-formitem:
        type: input
    S3_REGION:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 region
      x-formitem:
        type: input
    S3_BUCKET:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入 s3 bucket
      x-formitem:
        type: input
    CacheDB:
      # title: 缓存配置
      type: string
      default: redis
      description: 请选择缓存系统
      enum:
      - redis
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-formitem:
        type: select
    REDIS_PASSWORD:
      # title: DifyRedisPassword
      type: secret
      default: "123456"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redis密码
      x-formitem:
        type: input
    REDIS_HOST:
      # title: REDIS_HOST
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redis主机地址
      x-formitem:
        type: input
    REDIS_PORT:
      # title: REDIS_PORT
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redisd主机端口
      x-formitem:
        type: input
    REDIS_DATABASE:
      # title: REDIS_DATABASE
      type: string
      default: "0"
      description: ""
      x-cate: applicationCate
      x-label: 缓存配置
      x-restype: redis
      x-placeholder: 请输入Redis数据库
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: 请选择数据库类型
      enum:
      - mysql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-formitem:
        type: select
    MYSQL_HOST:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql host
      x-formitem:
        type: input
    MYSQL_PORT:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql port
      x-formitem:
        type: input
    MYSQL_DATABASE:
      # title: 数据库名 Host
      type: string
      default: "opencoze"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql database
      x-formitem:
        type: input
    MYSQL_USERNAME:
      # title: 数据库名 Host
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql user
      x-formitem:
        type: input
    MYSQL_PASSWORD:
      # title: 数据库名 Host
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mysql
      x-placeholder: 请输入 mysql password
      x-formitem:
        type: input
    KAFKA_BROKERS:
      type: string
      default: ""
      description: "需实现创建 topic: opencoze_knowledge, opencoze_search_app, opencoze_search_resource"
      x-cate: applicationCate
      x-label: 消息队列配置
      x-restype: kafka
      x-placeholder: kafka 集群地址
      x-formitem:
        type: input
    # rmqAccessKey:
    #   type: secret
    #   default: "xxxxxx"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: MQ配置
    #   x-restype: rmq
    #   x-placeholder: "请输入 rmq access key"
    #   x-formitem:
    #     type: input
    # rmqSecretKey:
    #   type: secret
    #   default: "xxxxxxx"
    #   description: ""
    #   x-cate: applicationCate
    #   x-label: MQ配置
    #   x-restype: rmq
    #   x-placeholder: "请输入 rmq secret key"
    #   x-formitem:
    #     type: input
    VectorDB:
      # title: 向量数据库配置
      type: string
      default: milvus
      description: ""
      enum:
      - milvus
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: 请选择向量数据库类型
      x-formitem:
        type: select
    MILVUS_HOST:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus 实例地址
      x-formitem:
        type: input
    MILVUS_PORT:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus 实例端口
      x-formitem:
        type: input
    MILVUS_USERNAME:
      # title: milvus token
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus user
      x-formitem:
        type: input
    MILVUS_PASSWORD:
      # title: milvus token
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus password
      x-formitem:
        type: input
    ELASTICSEARCH_HOST:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入Elasticsearch 实例地址
      x-formitem:
        type: input
    ELASTICSEARCH_PORT:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入Elasticsearch 实例地址
      x-formitem:
        type: input
    ELASTICSEARCH_USERNAME:
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入Elasticsearch username
      x-formitem:
        type: input
    ELASTICSEARCH_PASSWORD:
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入Elasticsearch passwd
      x-formitem:
        type: input
    ELASTICSEARCH_VERSION:
      type: string
      default: "v8"
      description: ""
      x-cate: applicationCate
      x-label: Elasticsearch配置
      x-restype: elasticsearch
      x-placeholder: 请输入 Elasticsearch version
      x-formitem:
        type: input
    embeddingType:
      type: string
      default: openai
      description: 选择大模型供应商
      enum:
      - openai
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-formitem:
        type: select
    OPENAI_URL:
      type: string
      default: ""
      description: ""
      pattern: "https?.*$"
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-placeholder: 请输入 openai Embedding BaseUrl
      x-formitem:
        type: input
    OPENAI_MODELNAME:
      # title: DifyRedisUserName
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-placeholder: 请输入 openai Embedding Model
      x-formitem:
        type: input
    OPENAI_API_KEY:
      # title: DifyRedisUserName
      type: secret
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-placeholder: 请输入 openai Embedding ApiKey
      x-formitem:
        type: input
    openaiEmbeddingDims:
      # title: DifyRedisUserName
      type: string
      default: "1024"
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-placeholder: 请输入 openai embedding dimensions
      x-formitem:
        type: input
    embeddingMaxBatchSize:
      # title: DifyRedisUserName
      type: string
      default: "100"
      description: ""
      x-cate: applicationCate
      x-label: embedding配置
      x-restype: openai
      x-placeholder: 请输入 embedding max batch size
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
