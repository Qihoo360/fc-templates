edition: 3.0.0
name: cozestudio-app
access: default
vars:
  region: { ? { region } }
  cozestudioBackendFunctionName: { ? { cozestudioBackendFunctionName } }
  cozestudioBackendDescription: { ? { cozestudioBackendDescription } }
  cozestudioFrontendFunctionName: { ? { cozestudioFrontendFunctionName } }
  cozestudioFrontendDescription: { ? { cozestudioFrontendDescription } }
  logLevel: { ? { logLevel } }
  pluginAesAuthSecret: { ? { pluginAesAuthSecret } }
  pluginAesStateSecret: { ? { pluginAesStateSecret } }
  pluginAesOauthTokenSecret: { ? { pluginAesOauthTokenSecret } }
  ObjectStorage: { ? { ObjectStorage } }
  s3Endpoint: { ? { s3Endpoint } }
  s3AccessKey: { ? { s3AccessKey } }
  s3SecretKey: { ? { s3SecretKey } }
  s3Region: { ? { s3Region } }
  s3Bucket: { ? { s3Bucket } }
  redisAddr: { ? { redisAddr } }
  redisPasswd: { ? { redisPasswd } }
  mysqlHost: { ? { mysqlHost } }
  mysqlPort: { ? { mysqlPort } }
  mysqlDatabase: { ? { mysqlDatabase } }
  mysqlUser: { ? { mysqlUser } }
  mysqlPasswd: { ? { mysqlPasswd } }
  MQ: { ? { MQ } }
  mqNamesvrAddr: { ? { mqNamesvrAddr } }
  VectorDB: { ? { VectorDB } }
  milvusAddress: { ? { milvusAddress } }
  milvusUser: { ? { milvusUser } }
  milvusPasswd: { ? { milvusPasswd } }
  elasticsearchUrl: { ? { elasticsearchUrl } }
  elasticsearchUsername: { ? { elasticsearchUsername } }
  elasticsearchPasswd: { ? { elasticsearchPasswd } }
  elasticsearchVersion: { ? { elasticsearchVersion } }
  embeddingType: { ? { embeddingType } }
  embeddingMaxBatchSize: { ? { embeddingMaxBatchSize } }
  openaiEmbeddingBaseUrl: { ? { openaiEmbeddingBaseUrl } }
  openaiEmbeddingModel: { ? { openaiEmbeddingModel } }
  openaiEmbeddingApiKey: { ? { openaiEmbeddingApiKey } }
  openaiEmbeddingDims: { ? { openaiEmbeddingDims } }
resources:
  cozestudioBackend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.cozestudioBackendDescription}
      runtime: custom
      memorySize: 5120
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 8888
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.cozestudioBackendFunctionName}
      sourceSubDir: code/coze-studio
      dockerfilePath: backend/Dockerfile
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        LISTEN_ADDR: ":8888"
        LOG_LEVEL: ${vars.logLevel}
        SERVER_HOST: "http://localhost:8888"
        USE_SSL: "0"
        MYSQL_DATABASE: ${vars.mysqlDatabase}
        MYSQL_HOST: ${vars.mysqlHost}
        MYSQL_PASSWORD: ${vars.mysqlPasswd}
        MYSQL_PORT: ${vars.mysqlPort}
        MYSQL_USER: ${vars.mysqlUser}
        MYSQL_DSN: "${vars.mysqlUser}:${vars.mysqlPasswd}@tcp(${vars.mysqlHost}:${vars.mysqlPort})/${vars.mysqlDatabase}?charset=utf8mb4&parseTime=True"
        ATLAS_URL: "mysql://${vars.mysqlUser}:${vars.mysqlPasswd}@${vars.mysqlHost}:${vars.mysqlPort}/${vars.mysqlDatabase}?charset=utf8mb4&parseTime=True"
        REDIS_ADDR: ${vars.redisAddr}
        REDIS_PASSWORD: ${vars.redisPasswd}
        FILE_UPLOAD_COMPONENT_TYPE: "storage"
        STORAGE_TYPE: ${vars.ObjectStorage}
        STORAGE_UPLOAD_HTTP_SCHEME: "http"
        S3_REGION: ${vars.s3Region}
        S3_ENDPOINT: ${vars.s3Endpoint}
        STORAGE_BUCKET: ${vars.s3Bucket}
        S3_ACCESS_KEY: ${vars.s3AccessKey}
        S3_SECRET_KEY: ${vars.s3SecretKey}
        ES_ADDR: ${vars.elasticsearchUrl}
        ES_USERNAME: ${vars.elasticsearchUsername}
        ES_PASSWORD: ${vars.elasticsearchPasswd}
        ES_VERSION: ${vars.elasticsearchVersion}
        COZE_MQ_TYPE: ${vars.MQ}
        MQ_NAME_SERVER: ${vars.mqNamesvrAddr}
        VECTOR_STORE_TYPE: ${vars.VectorDB}
        MILVUS_ADDR: ${vars.milvusAddress}
        MILVUS_USER: ${vars.milvusUser}
        MILVUS_PASSWD: ${vars.milvusPasswd}
        EMBEDDING_TYPE: ${vars.embeddingType}
        EMBEDDING_MAX_BATCH_SIZE: ${vars.embeddingMaxBatchSize}
        OPENAI_EMBEDDING_BASE_URL: ${vars.openaiEmbeddingBaseUrl}
        OPENAI_EMBEDDING_MODEL: ${vars.openaiEmbeddingModel}
        OPENAI_EMBEDDING_API_KEY: ${vars.openaiEmbeddingApiKey}
        OPENAI_EMBEDDING_DIMS: ${vars.openaiEmbeddingDims}
        PLUGIN_AES_AUTH_SECRET: ${vars.pluginAesAuthSecret}
        PLUGIN_AES_STATE_SECRET: ${vars.pluginAesStateSecret}
        PLUGIN_AES_OAUTH_TOKEN_SECRET: ${vars.pluginAesOauthTokenSecret}
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ""
  cozestudioFrontend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.cozestudioFrontendDescription}
      runtime: custom
      memorySize: 2048
      cpu: 2
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 80
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.cozestudioFrontendFunctionName}
      sourceSubDir: code/coze-studio
      dockerfilePath: frontend/Dockerfile
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        COZESTUDIO_BACKEND_URL: "http://${resources.cozestudioBackend.output.http_trigger_url}"
        MINIO_ENDPOINT: ${vars.s3Endpoint}
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ""
