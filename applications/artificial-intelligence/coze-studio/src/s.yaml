edition: 3.0.0
name: cozestudio-app
access: default
vars:
  region: { { region } }
  cozestudioBackendFunctionName: { { cozestudioBackendFunctionName } }
  cozestudioBackendDescription: { { cozestudioBackendDescription } }
  cozestudioFrontendFunctionName: { { cozestudioFrontendFunctionName } }
  cozestudioFrontendDescription: { { cozestudioFrontendDescription } }
  logLevel: { { logLevel } }
  pluginAesAuthSecret: { { pluginAesAuthSecret } }
  pluginAesStateSecret: { { pluginAesStateSecret } }
  pluginAesOauthTokenSecret: { { pluginAesOauthTokenSecret } }

  ObjectStorage: { { ObjectStorage } }
  S3_ENDPOINT: {{S3_ENDPOINT}}
  S3_AK: {{S3_AK}}
  S3_SK: {{S3_SK}}
  S3_REGION: {{S3_REGION}}
  S3_BUCKET: {{S3_BUCKET}}

  REDIS_HOST: {{REDIS_HOST}}
  REDIS_PORT: {{REDIS_PORT}}
  REDIS_PASSWORD: {{REDIS_PASSWORD}}

  MYSQL_HOST: { { MYSQL_HOST } }
  MYSQL_PORT: { { MYSQL_PORT } }
  MYSQL_DATABASE: { { MYSQL_DATABASE } }
  MYSQL_USERNAME: { { MYSQL_USERNAME } }
  MYSQL_PASSWORD: { { MYSQL_PASSWORD } }

  MQ: { { MQ } }
  mqNamesvrAddr: { { mqNamesvrAddr } }

  VectorDB: { { VectorDB } }
  MILVUS_HOST: {{MILVUS_HOST}}
  MILVUS_PORT: {{MILVUS_PORT}}
  MILVUS_USERNAME: {{MILVUS_USERNAME}}
  MILVUS_PASSWORD: {{MILVUS_PASSWORD}}

  ELASTICSEARCH_HOST: {{ELASTICSEARCH_HOST}}
  ELASTICSEARCH_PORT: {{ELASTICSEARCH_PORT}}
  ELASTICSEARCH_USERNAME: {{ELASTICSEARCH_USERNAME}}
  ELASTICSEARCH_PASSWORD: {{ELASTICSEARCH_PASSWORD}}
  ELASTICSEARCH_VERSION: {{ELASTICSEARCH_VERSION}}

  embeddingType: { { embeddingType } }
  embeddingMaxBatchSize: { { embeddingMaxBatchSize } }
  openaiEmbeddingBaseUrl: { { openaiEmbeddingBaseUrl } }
  openaiEmbeddingModel: { { openaiEmbeddingModel } }
  openaiEmbeddingApiKey: { { openaiEmbeddingApiKey } }
  openaiEmbeddingDims: { { openaiEmbeddingDims } }
resources:
  cozestudioBackend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.cozestudioBackendDescription}
      runtime: custom
      memorySize: 5120
      cpu: 4
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 8888
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.cozestudioBackendFunctionName}
      sourceSubDir: code/coze-studio
      dockerfilePath: backend/Dockerfile
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        LISTEN_ADDR: ":8888"
        LOG_LEVEL: ${vars.logLevel}
        SERVER_HOST: "http://localhost:8888"
        USE_SSL: "0"
        MYSQL_DATABASE: ${vars.MYSQL_DATABASE}
        MYSQL_HOST: ${vars.MYSQL_HOST}
        MYSQL_PASSWORD: ${vars.MYSQL_PASSWORD}

        MYSQL_PORT: ${vars.MYSQL_PORT}
        MYSQL_USER: ${vars.MYSQL_USERNAME}
        MYSQL_DSN: "${vars.MYSQL_USERNAME}:${vars.MYSQL_PASSWORD}@tcp(${vars.MYSQL_HOST}:${vars.MYSQL_PORT})/${vars.MYSQL_DATABASE}?charset=utf8mb4&parseTime=True"
        ATLAS_URL: "mysql://${vars.MYSQL_USERNAME}:${vars.MYSQL_PASSWORD}@${vars.MYSQL_HOST}:${vars.MYSQL_PORT}/${vars.MYSQL_DATABASE}?charset=utf8mb4&parseTime=True"
        REDIS_ADDR: "${vars.REDIS_HOST}:${vars.REDIS_PORT}"
        REDIS_PASSWORD: ${vars.REDIS_PASSWORD}
        FILE_UPLOAD_COMPONENT_TYPE: "storage"
        STORAGE_TYPE: ${vars.ObjectStorage}
        STORAGE_UPLOAD_HTTP_SCHEME: "http"
        S3_REGION: ${vars.S3_REGION}
        S3_ENDPOINT: ${vars.S3_ENDPOINT}
        STORAGE_BUCKET: ${vars.S3_BUCKET}
        S3_ACCESS_KEY: ${vars.S3_AK}
        S3_SECRET_KEY: ${vars.S3_SK}
        ES_ADDR: http://${vars.ELASTICSEARCH_HOST}:${vars.ELASTICSEARCH_PORT}
        ES_USERNAME: ${vars.ELASTICSEARCH_USERNAME}
        ES_PASSWORD: ${vars.ELASTICSEARCH_PASSWORD}
        ES_VERSION: ${vars.ELASTICSEARCH_VERSION}
        COZE_MQ_TYPE: ${vars.MQ}
        MQ_NAME_SERVER: ${vars.mqNamesvrAddr}
        VECTOR_STORE_TYPE: ${vars.VectorDB}
        MILVUS_ADDR: ${vars.MILVUS_HOST}:${vars.MILVUS_PORT}
        MILVUS_USER: ${vars.MILVUS_USERNAME}
        MILVUS_PASSWD: ${vars.MILVUS_PASSWORD}
        EMBEDDING_TYPE: ${vars.embeddingType}
        EMBEDDING_MAX_BATCH_SIZE: ${vars.embeddingMaxBatchSize}
        OPENAI_EMBEDDING_BASE_URL: ${vars.openaiEmbeddingBaseUrl}
        OPENAI_EMBEDDING_MODEL: ${vars.openaiEmbeddingModel}
        OPENAI_EMBEDDING_API_KEY: ${vars.openaiEmbeddingApiKey}
        OPENAI_EMBEDDING_DIMS: ${vars.openaiEmbeddingDims}
        OPENAI_EMBEDDING_BY_AZURE: "false"
        PLUGIN_AES_AUTH_SECRET: ${vars.pluginAesAuthSecret}
        PLUGIN_AES_STATE_SECRET: ${vars.pluginAesStateSecret}
        PLUGIN_AES_OAUTH_TOKEN_SECRET: ${vars.pluginAesOauthTokenSecret}
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ""
  cozestudioFrontend:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.cozestudioFrontendDescription}
      runtime: custom
      memorySize: 2048
      cpu: 2
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      port: 80
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.cozestudioFrontendFunctionName}
      sourceSubDir: code/coze-studio
      dockerfilePath: frontend/Dockerfile
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      environmentVariables:
        COZESTUDIO_BACKEND_URL: "http://${resources.cozestudioBackend.output.http_trigger_url}"
        MINIO_ENDPOINT: ${vars.s3Endpoint}
      triggers:
      - triggerName: httptrigger
        triggerType: http
        disableURLInternet: true
        funcVersion: LATEST
        triggerConfig:
          auth_type: None
          methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - HEAD
          - PATCH
          disable_url_internet: true
          auth_config: ""
