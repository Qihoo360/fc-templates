# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: "3.0.0"
Type: Project
Name: supabase
Provider:
- fc
Version: 0.0.1
Description: "快速部署 supabase 应用示例"
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/supabase
Organization: 函数计算 (FC)
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 开发平台
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - supabaseFunctionName
  - description
  - postgresUsername
  - postgresPassword
  - postgresPort
  - supabaseSupavisorKey
  - supabaseDashboardUsername
  - supabaseDashboardPassword
  - supabaseJWTSecret
  - supabaseAnonKey
  - supabaseServiceKey
  - supabaseRealtimeServiceKey
  - supabaseGotrueJWTExpire
  properties:
    region:
      title: 地域
      type: string
      default: test-2
      # default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
      - test-2
      - test-3
      - test-4
      - test-5
      - test-6
      # - cn-north-cu-1
      x-cate: resourceCate
      x-formitem:
        type: select
    supabaseFunctionName:
      title: supabase 函数名称
      type: string
      default: supabase-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 最大长度为 3-40 个字符，只能包含小写字母、数字中划线，不能以数字、中划线开头，过滤空格。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    description:
      title: 函数描述信息
      type: string
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    DatabaseType:
      title: 数据库类型
      type: string
      default: postgresql
      description: ""
      enum:
      - postgresql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    # postgresHost:
    #   title: Postgres 主机地址
    #   type: string
    #   default:  127.0.0.1
    #   pattern: ".{0,255}$"
    #   description: 最大长度为 255 个字符
    #   x-cate: resourceCate
    #   x-placeholder: 请输入 postgres 地址
    #   x-formitem:
    #     type: input
    postgresPort:
      title: 数据库端口
      type: string
      default: "5432"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库端口
      x-formitem:
        type: input
    postgresUsername:
      title: 数据库用户
      type: string
      default: supabase
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库用户
      x-formitem:
        type: input
    postgresPassword:
      title: Postgres 密码
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库密码
      x-formitem:
        type: input
    supabaseSupavisorKey:
      title: 数据库连接池密钥
      type: secret
      default: "${default-suffix}"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入连接池密钥
      x-hidden: true
      x-formitem:
        type: input
    supabaseDashboardUsername:
      title: 控制台账号
      type: string
      default: supabase
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 控制台设置
      x-placeholder: 请输入账号
      x-formitem:
        type: input
    supabaseDashboardPassword:
      title: 控制台密码
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 控制台设置
      x-placeholder: 请输入密码
      x-formitem:
        type: input
    supabaseJWTSecret:
      title: API JWT 密钥
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 用于生成 API TOKEN 的密钥，最大长度为 255 个字符
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入密钥
      x-formitem:
        type: input
    supabaseGotrueJWTExpire:
      title: 外部 JWT 过期时间
      type: string
      default: "3600"
      pattern: ".{0,255}$"
      description: 应用外部访问时使用的 JWT TOKEN 过期时间，最大长度为 255 个字符。
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入过期时间 (s)
      x-formitem:
        type: input
    supabaseAnonKey:
      title: 匿名角色 TOKEN
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 使用 API JWT 密钥，应用内部其他服务使用的 TOKEN。（参考 https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys 生成）
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入 ANON_KEY
      x-formitem:
        type: input
    supabaseServiceKey:
      title: 服务角色 TOKEN
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 使用 API JWT 密钥，应用内部其他服务使用的 TOKEN。（参考 https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys 生成）
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入 SERVICE_ROLE_KEY
      x-formitem:
        type: input
    supabaseRealtimeServiceKey:
      title: 实时通知服务密钥
      type: secret
      default: ${default-suffix}
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-placeholder: 请输入密钥
      x-hidden: true
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: ""
