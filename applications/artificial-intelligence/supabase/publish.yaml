# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: "3.0.0"
Type: Project
Name: supabase
Provider:
- fc
Version: 0.0.1
Description: "快速部署 supabase 应用示例"
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/supabase
Organization: 函数计算 (FC)
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 开发平台
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - supabaseFunctionName
  - description
  - postgresUsername
  - postgresPassword
  - postgresPort
  - supabaseSupavisorKey
  - supabaseDashboardUsername
  - supabaseDashboardPassword
  - supabaseJWTSecret
  - supabaseAnonKey
  - supabaseServiceKey
  - supabaseRealtimeServiceKey
  - supabaseGotrueJWTExpire
  - KAFKA_BROKERS
  - KAFKA_TOPIC
  - PULSAR_URL
  - PULSAR_TOPIC
  properties:
    region:
      title: 地域
      type: string
      default: test-2
      # default: cn-north-cu-1
      description: 创建应用所在的地区
      enum:
      - test-2
      - test-3
      - test-4
      - test-5
      - test-6
      # - cn-north-cu-1
      x-cate: resourceCate
      x-formitem:
        type: select
    supabaseFunctionName:
      title: supabase 函数名称
      type: string
      default: supabase-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 最大长度为 3-40 个字符，只能包含小写字母、数字中划线，不能以数字、中划线开头，过滤空格。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    description:
      title: 函数描述信息
      type: string
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    DatabaseType:
      title: 数据库类型
      type: string
      default: postgresql
      description: ""
      enum:
      - postgresql
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    # postgresHost:
    #   title: Postgres 主机地址
    #   type: string
    #   default:  127.0.0.1
    #   pattern: ".{0,255}$"
    #   description: 最大长度为 255 个字符
    #   x-cate: resourceCate
    #   x-placeholder: 请输入 postgres 地址
    #   x-formitem:
    #     type: input
    postgresPort:
      title: 数据库端口
      type: string
      default: "5432"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库端口
      x-formitem:
        type: input
    postgresUsername:
      title: 数据库用户
      type: string
      default: supabase
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库用户
      x-formitem:
        type: input
    postgresPassword:
      title: Postgres 密码
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 数据库密码
      x-formitem:
        type: input
    supabaseSupavisorKey:
      title: 数据库连接池密钥
      type: secret
      default: "${default-suffix}"
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入连接池密钥
      x-hidden: true
      x-formitem:
        type: input
    supabaseDashboardUsername:
      title: 控制台账号
      type: string
      default: supabase
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 控制台设置
      x-placeholder: 请输入账号
      x-formitem:
        type: input
    supabaseDashboardPassword:
      title: 控制台密码
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-label: 控制台设置
      x-placeholder: 请输入密码
      x-formitem:
        type: input
    supabaseJWTSecret:
      title: API JWT 密钥
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 用于生成 API TOKEN 的密钥，最大长度为 255 个字符
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入密钥
      x-formitem:
        type: input
    supabaseGotrueJWTExpire:
      title: 外部 JWT 过期时间
      type: string
      default: "3600"
      pattern: ".{0,255}$"
      description: 应用外部访问时使用的 JWT TOKEN 过期时间，最大长度为 255 个字符。
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入过期时间 (s)
      x-formitem:
        type: input
    supabaseAnonKey:
      title: 匿名角色 TOKEN
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 使用 API JWT 密钥，应用内部其他服务使用的 TOKEN。（参考 https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys 生成）
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入 ANON_KEY
      x-formitem:
        type: input
    supabaseServiceKey:
      title: 服务角色 TOKEN
      type: secret
      default: ""
      pattern: ".{0,255}$"
      description: 使用 API JWT 密钥，应用内部其他服务使用的 TOKEN。（参考 https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys 生成）
      x-cate: applicationCate
      x-label: API 设置
      x-placeholder: 请输入 SERVICE_ROLE_KEY
      x-formitem:
        type: input
    supabaseRealtimeServiceKey:
      title: 实时通知服务密钥
      type: secret
      default: ${default-suffix}
      pattern: ".{0,255}$"
      description: 最大长度为 255 个字符
      x-cate: applicationCate
      x-placeholder: 请输入密钥
      x-hidden: true
      x-formitem:
        type: input

    KAFKA_BROKERS:
      type: string
      description: "Kafka Broker 地址，逗号分隔"
      example: "127.0.0.1:9092,127.0.0.1:9093"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_BROKERS
      x-formitem:
        type: input
    KAFKA_USERNAME:
      type: string
      description: "Kafka 用户名"
      example: "kafka_user"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_USERNAME
      x-formitem:
        type: input
    KAFKA_PASSWORD:
      type: string
      description: "Kafka 密码"
      example: "kafka_pass"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_PASSWORD
      x-formitem:
        type: input
    KAFKA_SECURITY_PROTOCOL:
      type: string
      description: "Kafka 安全协议类型"
      enum: ["PLAINTEXT", "SASL_PLAINTEXT", "SASL_SSL", "SSL"]
      example: "PLAINTEXT"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_SECURITY_PROTOCOL
      x-formitem:
        type: input
    KAFKA_SASL_MECHANISM:
      type: string
      description: "Kafka SASL 机制"
      enum: ["PLAIN", "SCRAM-SHA-256", "SCRAM-SHA-512", "OAUTHBEARER"]
      example: "PLAIN"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_SASL_MECHANISM
      x-formitem:
        type: input
    KAFKA_TOPIC:
      type: string
      description: "Kafka Topic 名称"
      example: "test-topic"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_TOPIC
      x-formitem:
        type: input
    KAFKA_GROUP_ID:
      type: string
      description: "Kafka 消费组 ID"
      example: "consumer-group-1"
      x-cate: applicationCate
      x-label: KAFKA 设置
      x-restype: kafka
      x-placeholder: 请输入 KAFKA_GROUP_ID
      x-formitem:
        type: input

    PULSAR_URL:
      type: string
      description: "Pulsar Broker 地址，逗号分隔"
      example: "pulsar://127.0.0.1:6650,127.0.0.1:6651"
      x-cate: applicationCate
      x-label: PULSAR 设置
      x-placeholder: 请输入 PULSAR_URL
      x-restype: pulsar
      x-formitem:
        type: input
    PULSAR_TOKEN:
      type: string
      description: "Pulsar 认证 Token"
      example: "pulsar-token-xxxx"
      x-cate: applicationCate
      x-label: PULSAR 设置
      x-placeholder: 请输入 PULSAR_TOKEN
      x-restype: pulsar
      x-formitem:
        type: input
    PULSAR_TENANT:
      type: string
      description: "Pulsar 租户名称"
      example: "public"
      x-cate: applicationCate
      x-label: PULSAR 设置
      x-placeholder: 请输入 PULSAR_TENANT
      x-restype: pulsar
      x-formitem:
        type: input
    PULSAR_NAMESPACE:
      type: string
      description: "Pulsar 命名空间"
      example: "default"
      x-cate: applicationCate
      x-label: PULSAR 设置
      x-placeholder: 请输入 PULSAR_NAMESPACE
      x-restype: pulsar
      x-formitem:
        type: input
    PULSAR_TOPIC:
      type: string
      description: "Pulsar Topic 名称，完整路径"
      example: "persistent://public/default/test-topic"
      x-cate: applicationCate
      x-label: PULSAR 设置
      x-placeholder: 请输入 PULSAR_TOPIC
      x-restype: pulsar
      x-formitem:
        type: input

PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: ""
