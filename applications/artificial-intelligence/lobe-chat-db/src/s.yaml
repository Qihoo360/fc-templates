edition: 3.0.0
name: lobe-chat-app
access: default
vars:
  region: {{region}}
  FunctionName: {{FunctionName}}
  Describe: {{Description}}
  NEXT_PUBLIC_SERVICE_MODE: {{NEXT_PUBLIC_SERVICE_MODE}}
  MYSQL_URL: {{MYSQL_URL}}
  AUTH_CASDOOR_ISSUER: {{AUTH_CASDOOR_ISSUER}}
  AUTH_CASDOOR_ID: {{AUTH_CASDOOR_ID}}
  AUTH_CASDOOR_SECRET: {{AUTH_CASDOOR_SECRET}}
  S3_ENDPOINT: {{S3_ENDPOINT}}
  S3_REGION: {{S3_REGION}}
  S3_BUCKET: {{S3_BUCKET}}
  S3_ACCESS_KEY_ID: {{S3_AK}}
  S3_SECRET_ACCESS_KEY: {{S3_SK}}
  CustomDomain: {{CustomDomain}}
resources:
  lobe-chat:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.Describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 3210
      functionName: ${vars.FunctionName}
      sourceSubDir: code/lobehub
      environmentVariables:
        testkey: "testvalue"
        NEXT_PUBLIC_SERVICE_MODE: "${vars.NEXT_PUBLIC_SERVICE_MODE}"
        DATABASE_URL: "${vars.MYSQL_URL}"
        AUTH_CASDOOR_ISSUER: "${vars.AUTH_CASDOOR_ISSUER}"
        AUTH_CASDOOR_ID: "${vars.AUTH_CASDOOR_ID}"
        AUTH_CASDOOR_SECRET: "${vars.AUTH_CASDOOR_SECRET}"
        S3_ENDPOINT: "${vars.S3_ENDPOINT}"
        S3_REGION: "${vars.S3_REGION}"
        S3_BUCKET: "${vars.S3_BUCKET}"
        S3_ACCESS_KEY_ID: "${vars.S3_AK}"
        S3_SECRET_ACCESS_KEY: "${vars.S3_SK}"
        S3_PUBLIC_DOMAIN: "${vars.S3_HOST}"
        APP_URL: "${vars.CustomDomain}"
        NEXTAUTH_URL: "${vars.CustomDomain}/api/auth"
        KEY_VAULTS_SECRET: "Kix2wcUONd4CX51E/ZPAd36BqM4wzJgKjPtz2sGztqQ="
        NEXT_AUTH_SSO_PROVIDERS: "casdoor"
        NEXT_AUTH_SECRET: "NX2kaPE923dt6BL2U8e9oSre5RfoT7hg"
        S3_ENABLE_PATH_STYLE: "1"
        LLM_VISION_IMAGE_USE_BASE64: "1"
        TZ: "Asia/Shanghai"
      logConfig:
        isOpen: true
      scale:
        scale_config: 2
        min: 1
        max: 1
      buildProgramEntry: ""
      dockerfilePath: "Dockerfile.database"
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
