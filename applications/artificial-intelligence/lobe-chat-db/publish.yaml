# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Effective: Public
Name: lobe-chat-db-v3
Provider:
  - fc
Version: 0.0.3
Description: 该示例通过 LobeChat-DB 支持聊天记录持久化存储。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/lobe-chat-db
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - FunctionName
    - APP_URL
    - POSTGRES_URL
    - S3_REGION
    - S3_ENDPOINT
    - S3_BUCKET
    - S3_AK
    - S3_SK
    - AUTH_CASDOOR_ISSUER
    - AUTH_CASDOOR_ID
    - AUTH_CASDOOR_SECRET
    - S3_PUBLIC_DOMAIN
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: lobe-chat-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    Description:
      title: 函数描述
      type: string
      default: "Serverless lobe-chat"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    APP_URL:
      # title: CustomDomain
      type: string
      default: ""
      example: http://lobe-chat-db.example.com
      description: "应用公网调用访问地址；需要修改解析指向该应用函数"
      x-cate: applicationCate
      x-label: 自定义域名
      x-placeholder: 请输入自定义域名 http://lobe-chat-db.example.com
      x-formitem:
        type: input
    POSTGRES_URL:
      type: string
      default: ""
      description: "PG 数据库 URL: postgres://username:password@host:port/database"
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: postgresql
      x-placeholder: 请输入数据库 URL
      x-formitem:
        type: input
    AUTH_CASDOOR_ISSUER:
      # title: AUTH_CASDOOR_ISSUER
      type: string
      default: ""
      description: Casdoor 应用提供的 OpenID Connect 签发者
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: Casdoor 地址 https://cassdor-auth-api.example.com/
      x-formitem:
        type: input
    AUTH_CASDOOR_ID:
      # title: AUTH_CASDOOR_ID
      type: string
      default: ""
      description: Casdoor 应用详情页的客户端 ID
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: AUTH_CASDOOR_ID
      x-formitem:
        type: input
    AUTH_CASDOOR_SECRET:
      # title: AUTH_CASDOOR_SECRET
      type: string
      default: ""
      description: Casdoor 应用详情页的客户端密钥
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: AUTH_CASDOOR_SECRET
      x-formitem:
        type: input
    S3_ENDPOINT:
      # title: S3_ENDPOINT
      type: string
      default: https://lobe-s3-api.example.com
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入存储端点
      x-formitem:
        type: input
    S3_REGION:
      # title: S3_REGION
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入存储地域
      x-formitem:
        type: input
    S3_BUCKET:
      # title: S3_BUCKET
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: 请输入存储桶名
      x-formitem:
        type: input
    S3_AK:
      # title: S3_ACCESS_KEY_ID
      type: secret
      default: "AKIAIOSFODNN7EXAMPLE"
      description: S3 存储 ACCESS_KEY
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: S3_ACCESS_KEY_ID
      x-formitem:
        type: input
    S3_SK:
      # title: S3_SECRET_ACCESS_KEY
      type: secret
      default: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      description: S3 存储 SECRET_KEY
      x-cate: applicationCate
      x-label: 对象存储配置
      x-restype: s3
      x-placeholder: S3_SECRET_ACCESS_KEY
      x-formitem:
        type: input
    S3_PUBLIC_DOMAIN:
      # title: S3_PUBLIC_DOMAIN
      type: string
      default: ""
      description: "存储桶对外的访问域名，用于访问存储桶中的文件"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: https://lobe-s3-api.example.com
      x-restype: s3
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
