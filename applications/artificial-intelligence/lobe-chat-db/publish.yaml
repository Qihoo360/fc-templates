Edition: 3.0.0
Type: Project
Effective: Public
Name: lobe-chat-db-v3
Provider:
  - fc
Version: 0.0.3
Description: 本案例是将 lobe-chat-db，快速创建并部署到函数计算 FC 。
HomePage: https://github.com/Qihoo360/fc-templates/applications/artificial-intelligence/lobe-chat-db
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - FunctionName
    - NEXT_PUBLIC_SERVICE_MODE
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    FunctionName:
      title: 函数名
      type: string
      default: lobe-chat-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    Description:
      title: 函数描述
      type: string
      default: "Serverless lobe-chat"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    NEXT_PUBLIC_SERVICE_MODE:
      title: NEXT_PUBLIC_SERVICE_MODE
      type: string
      default: "server"
      description: "针对服务端数据库部署场景，需要设置为 server"
      x-cate: applicationCate
      x-label: 客户端/服务端
      x-placeholder: NEXT_PUBLIC_SERVICE_MODE
      x-formitem:
        type: input
    CustomDomain:
      title: CustomDomain
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 自定义域名
      x-placeholder: 请输入自定义域名
      x-formitem:
        type: input
    DATABASE_URL:
      title: DATABASE_URL
      type: string
      default: ""
      description: "例如：mysql://user:secret@host:port/database"
      x-cate: applicationCate
      x-label: 数据库配置
      x-placeholder: 请输入数据库地址
      x-formitem:
        type: input
    AUTH_CASDOOR_ISSUER:
      title: AUTH_CASDOOR_ISSUER
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: AUTH_CASDOOR_ISSUER
      x-formitem:
        type: input
    AUTH_CASDOOR_ID:
      title: AUTH_CASDOOR_ID
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: AUTH_CASDOOR_ID
      x-formitem:
        type: input
    AUTH_CASDOOR_SECRET:
      title: AUTH_CASDOOR_SECRET
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: AUTH_CASDOOR配置
      x-placeholder: AUTH_CASDOOR_SECRET
      x-formitem:
        type: input
    S3_ENDPOINT:
      title: S3_ENDPOINT
      type: string
      default: ""
      description: "存储端点"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入存储端点
      x-formitem:
        type: input
    S3_REGION:
      title: S3_REGION
      type: string
      default: ""
      description: "存储地域"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入存储地域
      x-formitem:
        type: input
    S3_BUCKET:
      title: S3_BUCKET
      type: string
      default: ""
      description: "存储桶"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入存储桶名
      x-formitem:
        type: input
    S3_ACCESS_KEY_ID:
      title: S3_ACCESS_KEY_ID
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: S3_ACCESS_KEY_ID
      x-formitem:
        type: input
    S3_SECRET_ACCESS_KEY:
      title: S3_SECRET_ACCESS_KEY
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: S3_SECRET_ACCESS_KEY
      x-formitem:
        type: input
    S3_PUBLIC_DOMAIN:
      title: S3_PUBLIC_DOMAIN
      type: string
      default: ""
      description: "公网域名"
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: S3_SECRET_ACCESS_KEY
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
