# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Name: kotaemon
Provider:
- fc
Version: 0.0.3
Description: 这是一个用kotaemon基于 RAG 的文档聊天 UI 开源示例。
HomePage: https://github.com/Qihoo360/fc-templates/tree/feature/main/applications/file-processor/kotaemon
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 文件处理
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - functionName
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      - cn-north-cu-1
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: kotaemon-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless kotaemon"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-formitem:
        type: input
    oneapiUrl:
      # title: oneapi 地址
      type: string
      default: ""
      pattern: "http.*"
      description: ""
      x-cate: applicationCate
      x-label: oneapi配置
      x-restype: openai
      x-placeholder: oneapi 地址
      x-formitem:
        type: input
    chatApiKey:
      # title: api key
      type: secret
      default: "123456"
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: oneapi配置
      x-restype: openai
      x-placeholder: api key
      x-formitem:
        type: input
PropertyDescription:
  PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
