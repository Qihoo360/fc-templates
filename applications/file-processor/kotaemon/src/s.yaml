edition: 3.0.0
name: kotaemon-app
access: default
vars:
  region: { { region } }
  describe: { { description } }
  functionName: { { functionName } }
resources:
  framework:
    component: fc
    props:
      region: ${vars.region}
      description: ${vars.describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 5120
      timeout: 100
      instanceConcurrency: 100
      port: 7860
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.functionName}
      sourceSubDir: kotaemon
      environmentVariables:
        GRADIO_SERVER_NAME: 0.0.0.0
        GRADIO_SERVER_PORT: 7860
        OPENAI_API_BASE: http://oneapi-apimarket-00028l00jv.cn-north-cu-1-vpc.fc.zyunapp.com/v1
        OPENAI_CHAT_MODEL: gpt-3.5-turbo
        OPENAI_EMBEDDINGS_MODEL: text-embedding-ada-002
      logConfig:
        isOpen: true
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
