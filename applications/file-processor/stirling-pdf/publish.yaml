Edition: 3.0.0
Type: Project
Name: stirling-pdf
Provider:
  - fc
Version: 0.0.3
Description: 本案例展示了如何将 Stirling-PDF（一个本地托管的 Web 应用程序，允许您对 PDF 文件执行各种操作）快速创建和部署到函数计算（FC）。
HomePage: https://github.com/Qihoo360/fc-templates/applications/file-processor/stirling-pdf
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 文件处理
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - functionName
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-1
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
      x-formitem:
        type: select
      x-cate: resourceCate
    functionName:
      title: 函数名
      type: string
      default: stirling-pdf-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-formitem:
        type: input
      x-cate: resourceCate
    description:
      title: 描述
      type: string
      default: "Serverless stirling-pdf"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-formitem:
        type: input
      x-cate: resourceCate
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""