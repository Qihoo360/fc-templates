edition: 3.0.0
name: mineru-app
access: default
vars:
  region: {{region}}
  describe: {{description}}
  functionName: {{functionName}}

  POLEFS_VOLUME: {{POLEFS_VOLUME}}
  VOLUME_MOUNT_PATH: /mnt/modelscope
  POLEFS_VOLUME_CREATE_USER: {{POLEFS_VOLUME_CREATE_USER}}
resources:
  framework:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 7860
      functionName: ${vars.functionName}
      sourceSubDir: mineru
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.POLEFS_VOLUME}
          mountDir: ${vars.VOLUME_MOUNT_PATH}
          createUserName: ${vars.POLEFS_VOLUME_CREATE_USER}
