edition: 3.0.0
name: docling-app
access: default
vars:
  region: {{region}}
  describe: {{description}}
  functionName: {{functionName}}
  functionPolefsVolumn: {{functionPolefsVolumn}}
  mountDir: {{afunctionMountDir}}
  afunctionVolCreateUser: {{afunctionVolCreateUser}}
resources:
  framework:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.describe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 5120
      timeout: 60
      instanceConcurrency: 100
      port: 7860
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      functionName: ${vars.functionName}
      sourceSubDir: docling
      logConfig:
        isOpen: false
      scale:
        scale_config: 2
        min: 1
        max: 300
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
      nasConfig:
        - volumeUniqueName: ${vars.functionPolefsVolumn}
          mountDir: ${vars.mountDir}
          createUserName: ${vars.afunctionVolCreateUser}
