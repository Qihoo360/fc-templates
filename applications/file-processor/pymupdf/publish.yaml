Edition: 3.0.0
Type: Project
Name: pymupdf
Provider:
- fc
Version: 0.0.3
Description: 该示例通过 PyMuPDF 操作 PDF 及图像格式文档。
HomePage: https://github.com/Qihoo360/fc-templates/applications/file-processor/pymupdf
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 文件处理
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - functionName
  properties:
    region:
      title: 地域
      type: string
      default: beijing
      description: 创建应用所在的地区
      enum:
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: pymupdf-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless pymupdf"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: ""
