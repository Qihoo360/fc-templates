Edition: 3.0.0
Type: Project
Effective: Public
Name: fc-zyun-markitdown
Provider:
- fc
Version: 0.0.3
Description: 该示例通过 MarkItDown 将多种文件转换为 Markdown。
HomePage: https://github.com/Qihoo360/fc-templates/applications/file-processor/markitdown
Organization: 函数计算（FC）
Tags:
- AI
- Custom Runtime
Category: 文件处理
Service:
  FC:
    Authorities:
    - 创建函数
Parameters:
  type: object
  additionalProperties: false
  required:
  - region
  - functionName
  - ObjectStorage
  - accessKey
  - secretKey
  - bucketName
  - bucketRegion
  - bucketEndpoint
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
      - test-2
      - test-3
      - test-4
      - test-5
      - test-6
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: fc-zyun-markitdown-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-cate: resourceCate
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    functionDescription:
      title: 函数描述
      type: string
      default: "Serverless fc-zyun-markitdown"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入函数描述
      x-formitem:
        type: input
    ObjectStorage:
      # title: 对象存储配置
      type: string
      default: OBS
      description: ""
      enum:
      - OBS
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: 请选择对象存储类型
      x-formitem:
        type: select
    accessKey:
      # title: AccessKeyID
      type: secret
      description: ""
      default: "AKIAIOSFODNN7EXAMPLE"
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: AccessKeyID
      x-formitem:
        type: input
    secretKey:
      # title: SecretAccessKey
      type: secret
      description: ""
      default: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: SecretAccessKey
      x-formitem:
        type: input
    bucketName:
      # title: bucket 名称
      type: string
      description: ""
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: 请输入存储桶名
      x-formitem:
        type: input
    bucketRegion:
      # title: bucket 地域
      type: string
      description: ""
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: 请输入存储桶地域
      x-formitem:
        type: input
    bucketEndpoint:
      # title: obs endpoint
      type: string
      description: ""
      x-cate: applicationCate
      x-label: obsLabel
      x-restype: s3
      x-placeholder: 请输入对象存储端点
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  obsLabel:
    title: "对象存储配置"
    description: "部署应用前，请针对具体的 Bucket 给出相应的授权，具体步骤可咨询管理人员。"
