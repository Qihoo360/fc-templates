# yaml-language-server: $schema=../../../schemas/publish-schema.json

Edition: 3.0.0
Type: Project
Name: fastgpt
Provider:
- fc
Version: 0.0.3
Description: 这是一个开箱即用的 AI 知识库平台应用（FastGPT）示例。
HomePage: https://github.com/Qihoo360/fc-templates/applications/file-processor/fastgpt
Organization: 函数计算（FC）
Effective: Public
Tags:
- AI
- Custom Runtime
Category: 文件处理
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required:
  # 必填项
  - region
  - sandboxFunctionName
  - sandboxDescription
  - functionName
  - description
  - oneapiUrl
  - chatApiKey
  - DataBase
  - MONGO_URL
  - VectorDB
  - milvusAddress
  - milvusToken
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
      - test-2
      - test-3
      - test-4
      - test-5
      - test-6
      - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    sandboxFunctionName:
      title: 函数名
      type: string
      default: fastgpt-sandbox-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入 fastgpt sandbox 函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    sandboxDescription:
      title: 描述
      type: string
      default: "fastgpt sandbox"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入 fastgpt sandbox 函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    functionName:
      title: 函数名
      type: string
      default: fastgpt-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless fastgpt"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-cate: resourceCate
      x-placeholder: 请输入AwsS3存储桶名
      x-formitem:
        type: input
    oneapiUrl:
      # title: oneapi 地址
      type: string
      default: ""
      pattern: "http.*"
      description: ""
      x-cate: applicationCate
      x-label: oneapi配置
      x-restype: openai
      x-placeholder: oneapi 地址
      x-formitem:
        type: input
    chatApiKey:
      # title: api key
      type: secret
      default: "123456"
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: oneapi配置
      x-restype: openai
      x-placeholder: api key
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mongodb
      description: ""
      enum:
      - mongodb
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mongo
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    MONGO_URL:
      # title: mongo 数据库连接参数
      type: string
      default: mongodb://username:password@0.0.0.0:27017/fastgpt?authSource=admin
      pattern: "mongodb://.*"
      description: ""
      x-cate: applicationCate
      x-label: 数据库配置
      x-restype: mongo
      x-placeholder: mongo 数据库连接参数
      x-formitem:
        type: input
    VectorDB:
      # title: 向量数据库配置
      type: string
      default: milvus
      description: ""
      enum:
      - milvus
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: 请选择向量数据库类型
      x-formitem:
        type: select
    MILVUS_URL:
      # title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus 向量库连接参数
      x-formitem:
        type: input
    MILVUS_TOKEN:
      # title: milvus token
      type: string
      default: "milvus_user:milvus_passwd"
      pattern: ".*"
      description: ""
      x-cate: applicationCate
      x-label: 向量数据库配置
      x-restype: milvus
      x-placeholder: milvus token
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
