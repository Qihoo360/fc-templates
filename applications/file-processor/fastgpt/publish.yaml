Edition: 3.0.0
Type: Project
Name: fastgpt
Provider:
  - fc
Version: 0.0.3
Description: A free, open-source, and powerful AI knowledge base platform, offers out-of-the-box data processing, model invocation, RAG retrieval, and visual AI workflows. Easily build complex LLM applications.
HomePage: https://github.com/Qihoo360/fc-templates/applications/file-processor/fastgpt
Organization: 函数计算（FC）
Effective: Public
Tags:
  - AI
  - Custom Runtime
Category: 文件处理
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - functionName
    - oneapiUrl
    - chatApiKey
    - mongodbUrl
    - milvusAddress
    - milvusToken
    - sandboxUrl
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-formitem:
        type: select
    functionName:
      title: 函数名
      type: string
      default: fastgpt-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{2,39}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 2-39 之间。
      x-placeholder: 请输入函数名
      x-formitem:
        type: input
    oneapiUrl:
      title: oneapi 地址
      type: string
      default: ""
      pattern: "http.*"
      description: ""
      x-label: oneapi配置
      x-placeholder: oneapi 地址
      x-formitem:
        type: input
    chatApiKey:
      title: api key
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-label: oneapi配置
      x-placeholder: api key
      x-formitem:
        type: input
    mongodbUrl:
      title: mongo 数据库连接参数
      type: string
      default: mongodb://username:password@0.0.0.0:27017/fastgpt?authSource=admin
      pattern: "mongodb://.*"
      description: ""
      x-label: 数据库配置
      x-placeholder: mongo 数据库连接参数
      x-formitem:
        type: input
    milvusAddress:
      title: milvus 向量库连接参数
      type: string
      default: ""
      pattern: ".*"
      description: ""
      x-label: 向量数据库配置
      x-placeholder: milvus 向量库连接参数
      x-formitem:
        type: input
    milvusToken:
      title: milvus token
      type: string
      default: "milvus_user:milvus_passwd"
      pattern: ".*"
      description: ""
      x-label: 向量数据库配置
      x-placeholder: milvus token
      x-formitem:
        type: input
    sandboxUrl:
      title: sandboxUrl
      type: string
      default: ""
      pattern: "http.*"
      description: ""
      x-label: 沙箱环境UrI
      x-placeholder: sandboxUrl
      x-formitem:
        type: input
    description:
      title: 描述
      type: string
      default: "Serverless fastgpt"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-label: 对象存储配置
      x-placeholder: 请输入AwsS3存储桶名
      x-formitem:
        type: input
