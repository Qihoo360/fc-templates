edition: 3.0.0
name: grafana-app
access: default
vars:
  region: {{region}}
  grafanaFunctionName: {{grafanaFunctionName}}
  grafanaDescribe: {{grafanaDescription}}
resources:
    grafana:
    component: ${path('/utils/components/zfc')}
    props:
      region: ${vars.region}
      description: ${vars.grafanaDescribe}
      runtime: custom
      memorySize: 10240
      cpu: 8
      diskSize: 512
      timeout: 100
      instanceConcurrency: 100
      requestType: http
      runtimeType: customize
      cloudBuildType: Dockerfile
      port: 3000
      functionName: ${vars.grafanaFunctionName}
      sourceSubDir: code/grafana
      code:
        templated_files:
          - code/grafana/conf/sample.ini
      environmentVariables:
        testkey: testvalue
      logConfig:
        isOpen: true
      scale:
        scale_config: 1
        min: 1
        max: 1
      buildProgramEntry: ""
      requestEntry: ""
      startCmd: ""
      requestEntryDescribe: ""
      triggers:
        - triggerName: httptrigger
          triggerType: http
          disableURLInternet: true
          funcVersion: LATEST
          triggerConfig:
            auth_type: None
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
              - PATCH
            disable_url_internet: true
            auth_config: ""
