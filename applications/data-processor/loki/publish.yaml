Edition: 3.0.0
Type: Project
Effective: Public
Name: loki-v3
Provider:
  - fc
Version: 0.0.3
Description: 这是通过Loki创建的水平可扩展、高可用给、多租户日志聚合系统的示例
HomePage: https://github.com/Qihoo360/fc-templates/applications/data-processor/loki
Organization: 函数计算（FC）
Tags:
  - AI
  - Custom Runtime
Category: Web框架
Service:
  FC:
    Authorities:
      - 创建函数
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - lokiFunctionName
    - grafanaFunctionName
    - ObjectStorage
    - LokiAwsEndpoint
    - LokiAwsRegion
    - LokiAwsBucket
    - LokiAwsAK
    - LokiAwsSK
    - DataBase
    - GrafanaMysqlUrl
  properties:
    region:
      title: 地域
      type: string
      default: test-3
      description: 创建应用所在的地区
      enum:
        - test-2
        - test-3
        - test-4
        - test-5
        - test-6
        - beijing
      x-cate: resourceCate
      x-formitem:
        type: select
    lokiFunctionName:
      title: Loki函数名
      type: string
      default: loki-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入Loki函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    lokiDescription:
      title: Loki描述
      type: string
      default: "Serverless loki"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入Loki函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    grafanaFunctionName:
      title: Grafana函数名
      type: string
      default: grafana-${default-suffix}
      pattern: "^[a-z][a-z0-9-]{3,40}$"
      description: 只能包含小写字母、数字中划线。不能以数字、中划线开头，过滤空格。长度在 3-40 之间。
      x-placeholder: 请输入Grafana函数名
      x-cate: resourceCate
      x-formitem:
        type: input
    grafanaDescription:
      title: Grafana描述
      type: string
      default: "Serverless grafana"
      pattern: ".{0,255}$"
      description: 最大长度为255个字符
      x-placeholder: 请输入Grafana函数描述
      x-cate: resourceCate
      x-formitem:
        type: input
    ObjectStorage:
      # title: 对象存储配置
      type: string
      default: OBS
      description: ""
      enum:
        - OBS
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请选择对象存储类型
      x-formitem:
        type: select
    LokiAwsEndpoint:
      title: LokiAwsEndpoint
      type: string
      default: ""
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入OBS端点
      x-formitem:
        type: input
    LokiAwsRegion:
      # title: LokiAwsRegion
      type: string
      default: beijing2
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入OBS区域
      x-formitem:
        type: input
    LokiAwsBucket:
      # title: LokiAwsBucket
      type: string
      default: bucket-loki-test
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入OBS存储桶名
      x-formitem:
        type: input
    LokiAwsAK:
      # title: LokiAwsAK
      type: secret
      default: "AKIAIOSFODNN7EXAMPLE"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入OBS AK
      x-formitem:
        type: input
    LokiAwsSK:
      # title: LokiAwsSK
      type: secret
      default: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      description: ""
      x-cate: applicationCate
      x-label: 对象存储配置
      x-placeholder: 请输入OBS SK
      x-formitem:
        type: input
    DataBase:
      # title: 数据库配置
      type: string
      default: mysql
      description: ""
      enum:
        - mysql
      x-cate: applicationCate
      x-label: Grafana数据库配置
      x-placeholder: 请选择数据库类型
      x-formitem:
        type: select
    GrafanaMysqlUrl:
      # title: Mysql数据库地址
      type: string
      default: ""
      description: "例如：mysql://user:secret@host:port/database"
      x-cate: applicationCate
      x-label: Grafana数据库配置
      x-placeholder: 请输入数据库地址
      x-formitem:
        type: input
PropertyDescription:
  resourceCate:
    title: "资源创建配置"
    description: ""
  applicationCate:
    title: "应用配置"
    description: "针对当前项目所需要的资源等，这部分资源可能会产生一定的费用。"
  grafana:
    title: "Grafana"
    description: "部署应用前，请添加数据库授权，具体步骤可咨询管理人员。"
  Loki:
    title: "Loki"
    description: ""
